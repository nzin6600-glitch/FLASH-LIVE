<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<title>FLASH LIVE PRO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2322e07f'/%3E%3Cpath d='M18.5 4 8 18h7l-1.5 10L24 13.5h-7z' fill='%2304140b'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10;
  --sf:#12151a;
  --cd:#181c22;
  --el:#222831;
  --ln:#262d37;
  --g:#22e07f;
  --gd:rgba(34,224,127,.15);
  --tx:#f2f5f8;
  --dm:#8e99a8;
  --rd:#ff4d4f;
  --yl:#ffd23f;
  --hm:#e11d48;
  --aw:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);font:13.5px/1.55 Inter,"Noto Sans Myanmar","Noto Sans Thai","Noto Sans SC",Pyidaungsu,system-ui,sans-serif;width:100%;max-width:1440px;margin:0 auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom));overflow-x:hidden}
html[lang=my] body{line-height:1.72;font-size:13px}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none}
input,select{font:inherit;color:inherit}

/* Header */
.hd{position:sticky;top:0;z-index:50;background:rgba(18,21,26,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
.tb1{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.logo svg{width:34px;height:34px}
.wm{display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;font-style:italic;letter-spacing:.4px;line-height:1}
.wm i{font-style:normal;background:var(--g);color:#04140b;padding:3px 6px;border-radius:6px;font-size:13px;font-weight:800}
.ac{display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);padding:6px 14px;border-radius:20px;font-weight:700;font-size:12px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dm)}
.pill.on{color:var(--g);border-color:var(--g);background:var(--gd)}
.pill.on i{background:var(--g);box-shadow:0 0 8px var(--g)}
.ib{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--cd);border:1px solid var(--ln)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

/* Date Strip */
.ds{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px;gap:2px}
.ds::-webkit-scrollbar{display:none}
.dt{flex:none;padding:9px 11px;color:var(--dm);font-weight:600;font-size:12.5px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
.dt.on{color:var(--g);border-color:var(--g);font-weight:700}

/* Pages & Cards */
.pg{padding:10px 12px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;margin-bottom:11px;overflow:hidden}
.cd.p{padding:14px}
.ct{padding:9px 14px;font-weight:700;font-size:12.5px;text-align:center;border-bottom:1px solid var(--ln)}
.h3{font-size:11.5px;color:var(--dm);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:10px 2px 7px;display:flex;align-items:center;justify-content:space-between}

/* League Group Header */
.lh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--ln);cursor:pointer}
.lh>div{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.lh b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt{width:24px;height:24px;flex:none;object-fit:contain;border-radius:50%;background:#fff;padding:2px}
.fg{width:18px;height:18px;object-fit:cover;border-radius:50%;flex:none}
.cv{width:18px;height:18px;flex:none;fill:none;stroke:var(--dm);stroke-width:2;transition:.2s}
.cd.cl .cv{transform:rotate(180deg)}
.cd.cl .lm{display:none}
.cd.cl .lh{border-bottom:0}

/* Match Row (Fixed Team Name Wrapping & Score Top Red Cards) */
.mr{display:grid;grid-template-columns:40px minmax(0,1fr) 58px minmax(0,1fr);gap:6px;align-items:center;padding:12px 10px;border-top:1px solid rgba(255,255,255,.045);cursor:pointer}
.mr:first-child{border-top:0}
.mr:active{background:rgba(255,255,255,.04)}
.bd{font-size:11px;font-weight:700;color:var(--dm);text-align:center;line-height:1.2}
.bd.lv{background:var(--g);color:#04140b;border-radius:12px;padding:3px 6px;font-weight:800;display:inline-block}
.ts{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:13px;line-height:1.3}
.ts.h{justify-content:flex-end;text-align:right}
/* Fix orphan character wrapping like Anderlech-t */
.ts span{
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  min-width:0;
  word-break:normal;
  overflow-wrap:break-word;
  hyphens:none;
}
.ts.w span{font-weight:700;color:#fff}
.tl{width:23px;height:23px;flex:none;object-fit:contain}
.tl.s{width:19px;height:19px}

/* Center Score with Red Cards on Top (Like Image 7) */
.mc{position:relative;text-align:center;font-weight:800;font-size:14.5px;letter-spacing:.3px;padding-top:2px}
.mc.lv{color:#fff}
.mc small{display:block;font-size:9.5px;color:var(--dm);font-weight:600;margin-top:1px}
.mc .tm{font-size:12px;color:var(--dm);font-weight:600}
.mc-rc{display:flex;justify-content:space-between;align-items:center;height:9px;margin-bottom:2px;padding:0 6px}
.mc-rc span{display:flex;gap:2px}
.rcd{display:inline-block;width:6px;height:8.5px;background:var(--rd);border-radius:1.5px}

/* News View (Image 3 Style) */
.nhd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.nhd h1{font-size:21px;font-weight:800}
.ntabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln);padding:0 8px}
.ntabs::-webkit-scrollbar{display:none}
.ntab{flex:none;padding:10px 12px;font-size:13px;font-weight:700;color:var(--dm);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.ntab.on{color:#fff;border-color:var(--g)}
.nf-sec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:12px 0 10px}
.nf-sec i{width:24px;height:24px;border-radius:50%;background:var(--g);color:#04140b;display:grid;place-items:center;font-style:normal;font-size:13px}
.n-hero{margin-bottom:16px;cursor:pointer;display:block;text-decoration:none;color:inherit}
.n-hero img{width:100%;height:195px;object-fit:cover;border-radius:14px;background:var(--el);margin-bottom:10px}
.n-hero b{display:block;font-size:16px;font-weight:700;line-height:1.4;margin-bottom:6px}
.n-meta{display:flex;align-items:center;gap:6px;color:var(--dm);font-size:11.5px}
.n-meta .src-ic{width:16px;height:16px;border-radius:4px;background:var(--g);color:#04140b;display:inline-grid;place-items:center;font-weight:900;font-size:9px;font-style:normal}
.n-meta .src-ic.r{background:#e11d48;color:#fff}
.n-item{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.06);text-decoration:none;color:inherit}
.n-item img{width:118px;height:78px;object-fit:cover;border-radius:10px;background:var(--el)}
.n-item b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:600;line-height:1.38;margin-bottom:6px}

/* Modals */
.mo{position:fixed;inset:0;width:100%;max-width:960px;margin:0 auto;background:var(--bg);overflow-y:auto;display:none;z-index:100}
.mo.open{display:block}
.mt{position:sticky;top:0;z-index:20;background:rgba(18,21,26,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top)}
.mn{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:8px}
.mn>b{flex:1;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.mn small{display:block;color:var(--dm);font-weight:500;font-size:11px}

/* Match Header */
.mh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:6px 12px 14px;text-align:center;align-items:start}
.ht{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.ht img{width:52px;height:52px;object-fit:contain}
.ht b{font-size:13px;line-height:1.3;display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap}
.ht small{font-size:10.5px;color:var(--dm);line-height:1.45}
.sn{font-size:28px;font-weight:900;letter-spacing:1.5px;line-height:1.15;padding-top:6px}
.ss{font-size:11.5px;color:var(--dm);font-weight:700;margin-top:3px}
.ss.lv{color:var(--g)}
.psb{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px}
.psb span{font-size:10px;background:var(--el);color:var(--dm);padding:2px 8px;border-radius:8px;font-weight:600}

/* Tabs & Pills */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--ln)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 13px;font-size:12.5px;font-weight:700;color:var(--dm);border-bottom:3px solid transparent;white-space:nowrap;text-align:center;cursor:pointer}
.tab.on{color:var(--g);border-color:var(--g)}
.pls{display:flex;gap:7px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pls::-webkit-scrollbar{display:none}
.pl{flex:none;padding:6px 13px;border-radius:18px;border:1px solid var(--ln);background:var(--cd);color:var(--dm);font-weight:700;font-size:12px}
.pl.on{background:var(--g);color:#04140b;border-color:var(--g)}

/* FotMob Style Match Events Timeline (Image 5 Style) */
.ev-list{padding:4px 0}
.ev{display:flex;align-items:center;gap:12px;padding:10px 4px}
.ev.a{flex-direction:row-reverse;text-align:right}
.et{width:34px;text-align:center;font-weight:700;color:var(--tx);font-size:13px;flex:none;line-height:1.2}
.et small{display:block;color:var(--dm);font-size:10.5px;font-weight:600}
.ei{width:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:none}
.ev-body{min-width:0;flex:1}
.ev-body b{font-weight:600;font-size:13.5px;cursor:pointer}
.ev-body small{display:block;color:var(--dm);font-size:12px;margin-top:1px}
.ev .in{color:#22e07f;font-weight:600;font-size:13px}
.ev .out{color:#ff5a5f;font-size:12.5px}
.sc2{color:var(--g);font-weight:700}

/* Cards, Own Goal, VAR & Sub Horizontal Arrows (Image 5) */
.cr{display:inline-block;width:13px;height:18px;border-radius:2.5px}
.cr.y{background:var(--yl)}
.cr.r{background:var(--rd)}
.cr.yr{background:linear-gradient(135deg,var(--yl) 50%,var(--rd) 50%)}
.cr.sm{width:8px;height:11px}
.ar{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-style:normal;font-weight:900;line-height:1}
.ar.in{background:#22e07f;color:#04140b}
.ar.out{background:#ff4d4f;color:#04140b}
.ar.sm{width:13px;height:13px;font-size:8.5px}
.ball-ic{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;line-height:1}
.ball-ic.og{background:var(--rd);color:#fff;padding:2px}
.var-bx{border:1.5px solid #fff;border-radius:3px;padding:1px 3px;font-size:8.5px;font-weight:900;letter-spacing:.3px;line-height:1.1}

/* HT Circle Badge & Added Time Divider (Image 5) */
.ht-div{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--tx);font-weight:700;font-size:13px}
.ht-div::before,.ht-div::after{content:"";flex:1;height:1px;background:var(--ln)}
.ht-cir{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--dm);display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.add-tm{text-align:center;color:var(--dm);font-size:12.5px;font-weight:600;margin:8px 0}

/* Key-Value & Stats Bars */
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.045);font-size:12.5px}
.kv:first-child{border-top:0}
.kv b{text-align:right;font-weight:700}
.kv span{color:var(--dm)}
.st{padding:8px 0;border-top:1px solid rgba(255,255,255,.03)}
.st:first-child{border-top:0}
.sr{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
.sr span{color:var(--dm);font-weight:500;text-align:center;padding:0 8px;font-size:12px}
.bar{display:flex;gap:4px;margin-top:6px;height:6px}
.bar div{height:100%;border-radius:3px;background:var(--el)}
.bar .hh{background:var(--hm)}
.bar .aa{background:var(--aw)}
.pb{display:flex;height:28px;border-radius:14px;overflow:hidden;font-weight:800;font-size:12.5px;gap:2px}
.pb div{display:flex;align-items:center;padding:0 12px;min-width:40px;color:#fff}
.pb .h{background:var(--hm)}
.pb .a{background:var(--aw);justify-content:flex-end}

/* 3D Tactical Pitch */
.pt{position:relative;border-radius:14px;padding:12px 6px;margin-bottom:12px;background:repeating-linear-gradient(0deg,#143d27 0 44px,#113320 44px 88px);border:2px solid rgba(255,255,255,.22);overflow:hidden}
.pt::before{content:"";position:absolute;left:50%;top:50%;width:76px;height:76px;border:1.5px solid rgba(255,255,255,.16);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.pt::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:rgba(255,255,255,.16);pointer-events:none}
.pth{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-weight:700;font-size:12px;margin-bottom:10px}
.pth span{display:flex;align-items:center;gap:6px}
.pr{position:relative;z-index:2;display:flex;justify-content:space-around;margin:14px 0}
.pn{position:relative;width:74px;text-align:center;font-size:10.5px;font-weight:600;line-height:1.25;cursor:pointer}
.pa{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--el);border:2px solid #fff;margin:0 auto 3px}
.bg{position:absolute;top:-4px;right:6px;background:var(--g);color:#04140b;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:7px;line-height:1.35}
.bg.m{background:var(--yl)}
.bg.l{background:#ff8a4c}
.bg.n{background:#fff}
.nb{position:absolute;left:8px;top:28px;width:18px;height:18px;border-radius:50%;background:#0a0d12;color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:1.5px solid #fff}
.pn>span:last-child{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000;color:#fff;font-weight:700}
.ic2{position:absolute;left:2px;top:-4px;display:flex;gap:1px;align-items:center;background:rgba(0,0,0,.65);padding:1px 3px;border-radius:6px}
.ic2 .ib2{font-size:10px;font-style:normal;line-height:1}

/* Player & List Rows */
.pw{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.045);cursor:pointer}
.pw:first-child{border-top:0}
.pw img.pa{width:38px;height:38px;margin:0;flex:none}
.pw>div{flex:1;min-width:0}
.pw b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw small{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--dm);font-size:11px}
.pw .bg{position:static;flex:none}

/* Standings Table */
.tbw{overflow-x:auto;scrollbar-width:none}
.tbw::-webkit-scrollbar{display:none}
.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{color:var(--dm);font-weight:700;padding:8px 4px;text-align:center;font-size:11px;border-bottom:1px solid var(--ln)}
.tb td{padding:8.5px 4px;text-align:center;border-top:1px solid rgba(255,255,255,.04)}
.tb .l{text-align:left;padding-left:6px}
.tb tr.hl td{background:var(--gd)}
.tb tr[data-team]{cursor:pointer}
.tb td:not(.l),.tb th:not(.l){width:1%;white-space:nowrap;padding-left:5px;padding-right:5px}
.tb td.l{width:100%;max-width:160px}
.tc{display:flex;align-items:center;gap:7px;font-weight:600;min-width:0}
.tc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{margin-left:auto;background:var(--g);color:#04140b;font-weight:800;font-size:10.5px;padding:1.5px 7px;border-radius:10px;white-space:nowrap;flex:none}
.fd{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:9.5px;font-weight:800;font-style:normal;margin-right:2px;color:#fff}
.fd.W{background:#16a34a}
.fd.D{background:#64748b}
.fd.L{background:var(--rd)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;color:var(--dm);font-size:11px;border-top:1px solid var(--ln)}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* H2H & Odds Grids */
.h3s{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.h3s small{display:block;color:var(--dm);margin-top:5px;font-size:11px}
.pb2{display:inline-grid;place-items:center;min-width:76px;height:40px;border-radius:20px;font-weight:800;font-size:17px;padding:0 12px;color:#fff}
.pb2.hh{background:var(--hm)}
.pb2.dd{background:#334155}
.pb2.aa{background:var(--aw)}
.fs{display:flex;align-items:center;gap:6px;margin:8px 0}
.fs>span{margin-right:4px;display:flex;align-items:center;gap:6px;min-width:110px;font-size:12px;font-weight:600}
.fs .fd{cursor:pointer}
.hd2{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 2px;color:var(--dm);font-size:11px}
.tag{background:var(--el);padding:2px 8px;border-radius:8px;font-weight:600;font-size:10.5px}
.odg{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px;margin-top:6px}
.odb{background:var(--el);border:1px solid var(--ln);border-radius:9px;padding:7px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.odb span{color:var(--dm);font-weight:600}
.odb b{color:var(--g);font-weight:800}

/* Player Hero */
.phd{text-align:center;padding:18px 12px 14px;margin:-10px -12px 12px;background:linear-gradient(180deg,#1e293b,var(--bg));border-bottom:1px solid var(--ln)}
.pph{position:relative;width:92px;height:92px;margin:0 auto 8px}
.pph>img{width:92px;height:92px;border-radius:50%;object-fit:cover;background:var(--el);border:3px solid rgba(255,255,255,.85)}
.pph .bg{top:-4px;right:-10px;font-size:11.5px;padding:2px 7px}
.ptm{position:absolute;right:-4px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);display:grid;place-items:center;cursor:pointer}
.ptm img{width:24px;height:24px;object-fit:contain}
.pnm{font-size:17px;font-weight:800;display:block}
.p3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.p3>div{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:7px 4px}
.p3 b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px}
.p3 small{color:var(--dm);font-size:10.5px;display:block;margin-top:2px}

/* 5-Tab Bottom Navigation (Matches, News, Leagues, Favorites, More) */

/* API Engine with Persistent Caching to Save Quota */
const cache=new Map(),inf=new Map();
function api(ep,ttl=300000){
  const c=cache.get(ep);
  if(c&&Date.now()-c.t<ttl)return Promise.resolve(c.d);
  if(inf.has(ep))return inf.get(ep);
  const p=(async()=>{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),22000);
    try{
      const r=await fetch(BASE+'/'+ep,{headers:{'x-apisports-key':cfg().key},signal:ctl.signal});
      const j=await r.json();
      const e=j.errors&&(Array.isArray(j.errors)?j.errors[0]:Object.values(j.errors)[0]);
      if(!r.ok||e)throw new Error(e||'HTTP '+r.status);
      const res=ep==='status'?j.response:(j.response||[]);
      cache.set(ep,{t:Date.now(),d:res});
      return res;
    }finally{clearTimeout(to);inf.delete(ep)}
  })();
  inf.set(ep,p);
  return p;
}

  });
}

      const ic=e.type==='Goal'?(e.detail==='Missed Penalty'?'❌':e.detail==='Own Goal'?'<span class="ball-ic og">⚽</span>':'<span class="ball-ic">⚽</span>'):e.type==='Card'?`<span class="cr ${/Second/i.test(e.detail)?'yr':/Red/i.test(e.detail)?'r':'y'}"></span>`:sb?'<i class="ar in">→</i><i class="ar out">←</i>':'<span class="var-bx">VAR</span>';

/* ---------- Lineups & 3D Pitch ---------- */
const PS={},PI={};
const posK={Goalkeeper:'pG',Defender:'pD',Midfielder:'pM',Attacker:'pF',G:'pG',D:'pD',M:'pM',F:'pF'};
const evOf=id=>{
  const o={g:0,og:0,y:0,r:0,out:0,inn:0};
  (M.events||[]).forEach(e=>{
    if(e.type==='Goal'&&e.player.id===id){if(e.detail==='Own Goal')o.og++;else if(e.detail!=='Missed Penalty')o.g++}
    if(e.type==='Card'&&e.player.id===id){/Red|Second/i.test(e.detail)?o.r++:o.y++}
    if(e.type==='subst'){if(e.player.id===id)o.out=e.time.elapsed;if(e.assist&&e.assist.id===id)o.inn=e.time.elapsed}
  });
  return o;
};
const icoOf=id=>{
  const o=evOf(id);
  return(o.g?`<i class="ib2">⚽${o.g>1?o.g:''}</i>`:'')+(o.og?'<i class="ib2">OG</i>':'')+(o.y?'<i class="cr y sm"></i>':'')+(o.r?'<i class="cr r sm"></i>':'')+(o.out?'<i class="ar out sm">←</i>':'')+(o.inn?'<i class="ar in sm">→</i>':'');
};

async function drawLineup(){
  const L=M.lineups||[],b=$('mb');if(!L.length){b.innerHTML=pend('pend_lu');return}
  b.innerHTML=load;const id=M.fixture.id;
  const [pl,...sq]=await Promise.all([api(`fixtures/players?fixture=${id}`,60000).catch(()=>[]),...L.map(l=>api(`players/squads?team=${l.team.id}`,36e5).catch(()=>[]))]);
  if(M.fixture.id!==id||tab!=='lineup')return;
  const P={},Age={};
  pl.forEach(tm=>tm.players.forEach(p=>{
    const s=p.statistics[0]||{};
    P[p.player.id]={ph:p.player.photo,r:s.games&&s.games.rating,min:s.games&&s.games.minutes,g:s.goals&&s.goals.total,a:s.goals&&s.goals.assists,cap:s.games&&s.games.captain};
    PS[p.player.id]=s;
    PI[p.player.id]=Object.assign(PI[p.player.id]||{},{name:p.player.name,photo:p.player.photo,team:tm.team});
  }));
  sq.forEach(s=>((s[0]&&s[0].players)||[]).forEach(p=>Age[p.id]=p.age));
  L.forEach(l=>[...(l.startXI||[]),...(l.substitutes||[])].forEach(o=>{
    PI[o.player.id]=Object.assign(PI[o.player.id]||{},{name:o.player.name,num:o.player.number,pos:o.player.pos,team:l.team});
  }));
  const badge=p=>{
    const d=P[p.id]||{};let v='',c='';
    if(mode==='rating'&&d.r){v=Number(d.r).toFixed(1);c=d.r>=7.5?'':d.r>=6.5?'m':'l'}
    else if(mode==='age'&&Age[p.id]){v=num(Age[p.id]);c='n'}
    else if(mode==='ga'){v=(d.g?'⚽'+num(d.g):'')+(d.a?' 👟'+num(d.a):'');c='n'}
    return v?`<span class="bg ${c}">${v.trim()}</span>`:'';
  };
  const av=p=>`<img class="pa" src="${esc((P[p.id]&&P[p.id].ph)||`https://media.api-sports.io/football/players/${p.id}.png`)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
  const S=M.league.season,pills=['rating','age','ga'].map(k=>`<button class="pl ${mode===k?'on':''}" data-mode="${k}">${t(k)}</button>`).join('');
  b.innerHTML=`<div class="pls">${pills}</div><div class="h3" style="justify-content:center">${t('tip')}</div>`+L.map(l=>{
    const rows={};
    (l.startXI||[]).forEach((o,i)=>{const p=o.player,g=(p.grid||'').split(':'),r=+g[0]||Math.floor(i/4)+1;(rows[r]=rows[r]||[]).push({...p,c:+g[1]||i})});
    const kit=l.team&&l.team.colors&&l.team.colors.player&&l.team.colors.player.primary?`#${l.team.colors.player.primary}`:'#0a0d12';
    const pitch=Object.keys(rows).sort((a,b)=>a-b).map(r=>`<div class="pr">${rows[r].sort((a,b)=>a.c-b.c).map(p=>`<div class="pn" data-pl="${p.id}" data-s="${S}">${av(p)}${badge(p)}<span class="ic2">${icoOf(p.id)}</span><i class="nb" style="font-style:normal;background:${esc(kit)}">${num(p.number)}</i><span>${P[p.id]&&P[p.id].cap?'(C) ':''}${esc((p.name||'').split(' ').slice(-1)[0])}</span></div>`).join('')}</div>`).join('');
    const subs=(l.substitutes||[]).map(o=>{const p=o.player,d=P[p.id]||{};return`<div class="pw" data-pl="${p.id}" data-s="${S}">${av(p)}<div><b>${num(p.number)} · ${esc(p.name)}</b><small>${esc(posK[p.pos]?t(posK[p.pos]):p.pos||'')}${d.min?' · '+num(d.min)+'′':''}${Age[p.id]?' · '+t('age')+' '+num(Age[p.id]):''} ${icoOf(p.id)}</small></div>${badge(p)}</div>`}).join('');

      (L.length?`<div class="h3">${t('formations')}</div><div class="cd p">${L.map(x=>`<div class="kv"><span>${esc(x.formation)}</span><b>${num(x.played)} ${t('p')}</b></div>`).join('')}</div>`:''),true,tabs);

  }
}

async function openLeague(id,season){if(!id)return;pushSub(()=>renderLeague(id,season,'table'))}
async function renderLeague(id,season,ltab){
  curTeam=null;
  if(!season){const r=await api(`leagues?id=${id}`,864e5).catch(()=>[]);season=((r[0]&&r[0].seasons)||[]).find(s=>s.current)?.year||new Date().getFullYear()}
  const tabs=['table','matches','scorers','assists','cards'].map(k=>`<div class="tab ${ltab===k?'on':''}" data-ltab="${k}" data-lgid="${id}" data-lgs="${season}">${t(k)}</div>`).join('');
  sub('','<div class="ld"></div>',false,tabs);
  const lg=await api(`leagues?id=${id}`,864e5).catch(()=>[]);
  const L=lg&&lg[0];
  const allSeas=((L&&L.seasons)||[]).map(s=>s.year).sort((a,b)=>b-a);
  const hdr=L?`<div class="cd p" style="display:flex;gap:14px;align-items:center;justify-content:space-between"><div style="display:flex;gap:12px;align-items:center"><img src="${esc(L.league.logo)}" style="width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px;padding:5px" alt=""><div><b style="font-size:16px">${esc(L.league.name)}</b><small style="display:block;color:var(--dm)">${esc(L.country.name||'')} · ${num(season)}</small></div></div>${allSeas.length>1?`<select style="width:auto;margin:0;padding:6px 10px" onchange="renderLeague(${id},+this.value,'${ltab}')">${allSeas.slice(0,8).map(y=>`<option value="${y}" ${y==season?'selected':''}>${num(y)}</option>`).join('')}</select>`:''}</div>`:'';

  if(ltab==='table'){
    const st=await api(`standings?league=${id}&season=${season}`,6e5).catch(()=>[]);
    const gs=(st[0]&&st[0].league.standings)||[];
    sub(L?L.league.name:'',hdr+(gs.length?tbl(gs,[],{},'all'):none()),false,tabs);
  }
  else if(ltab==='matches'){
    const [nx,ls]=await Promise.all([api(`fixtures?league=${id}&season=${season}&next=15&${TZQ()}`,3e5).catch(()=>[]),api(`fixtures?league=${id}&season=${season}&last=15&${TZQ()}`,3e5).catch(()=>[])]);
    const sec=(k,a)=>a&&a.length?`<div class="h3">${t(k)}</div><div class="cd">${a.map(row).join('')}</div>`:'';
    sub(L?L.league.name:'',hdr+(nx.length||ls.length?sec('next',nx)+sec('last',ls):none()),false,tabs);
  }
  else if(ltab==='scorers'||ltab==='assists'||ltab==='cards'){
    const ep=ltab==='scorers'?'topscorers':ltab==='assists'?'topassists':'topyellowcards';
    const sc=await api(`players/${ep}?league=${id}&season=${season}`,6e5).catch(()=>[]);
    const list=(sc||[]).slice(0,20).map((o,i)=>{
      const s=o.statistics[0]||{};
      const val=ltab==='scorers'?(s.goals&&s.goals.total||0):ltab==='assists'?(s.goals&&s.goals.assists||0):`🟨${s.cards&&s.cards.yellow||0} 🟥${s.cards&&s.cards.red||0}`;
      return`<div class="pw" data-pl="${o.player.id}" data-s="${season}">${im(o.player.photo,'pa')}<div><b>${num(i+1)}. ${esc(o.player.name)}</b><small>${im(s.team.logo,'tl s')} ${esc(s.team.name)} · ${t('p')} ${num(s.games&&s.games.appearences||0)}</small></div><b style="color:var(--g);font-size:14px">${num(val)}</b></div>`;
    }).join('');
    sub(L?L.league.name:'',hdr+(list?`<div class="cd p">${list}</div>`:none()),false,tabs);
  }
}

const makeUserId=()=>{let id=localStorage.getItem('FLASH_LIVE_USER_ID');if(!id){id='FL-'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,12).toUpperCase():Math.random().toString(36).slice(2,14).toUpperCase());localStorage.setItem('FLASH_LIVE_USER_ID',id)}return id};
let notificationCache=[],seenNotificationIds=new Set(),notificationAudioReady=false;
const nt=()=>NOTI_TEXT[lang]||NOTI_TEXT.en;
async function refreshNotificationBadge(){try{const r=await fetch('/api/notifications?user_id='+encodeURIComponent(makeUserId())+'&lang='+encodeURIComponent(lang),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();const incoming=Array.isArray(j.notifications)?j.notifications:[];const fresh=incoming.filter(x=>!x.read&&!seenNotificationIds.has(x.id));if(seenNotificationIds.size){fresh.forEach(x=>{try{if('Notification'in window&&Notification.permission==='granted')new Notification('FLASH LIVE',{body:(x.title||'')+' — '+(x.body||''),icon:'/favicon.ico',tag:x.id})}catch(e){}playNotificationTone()})}incoming.forEach(x=>seenNotificationIds.add(x.id));notificationCache=incoming;const n=notificationCache.filter(x=>!x.read).length;const b=$('notificationBadge');if(b){b.hidden=!n;b.textContent=n>99?'99+':String(n)}}catch(e){console.warn('Notification sync failed',e)}}
function playNotificationTone(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.36);o.onended=()=>c.close()}catch(e){}}

async function openNotifications(){closeNotificationPanel();const overlay=document.createElement('div');overlay.id='notificationOverlay';overlay.className='noti-backdrop';overlay.innerHTML=`<section class="noti-panel" role="dialog" aria-modal="true"><header class="noti-head"><strong>${nt().title}</strong><div style="display:flex;gap:14px"><button id="markAllNotifications">${nt().mark}</button><button id="closeNotifications" aria-label="Close">✕</button></div></header><div id="notificationList" class="noti-empty">Loading…</div></section>`;overlay.addEventListener('click',e=>{if(e.target===overlay)closeNotificationPanel()});document.body.appendChild(overlay);$('closeNotifications').onclick=closeNotificationPanel;$('markAllNotifications').onclick=async()=>{try{const r=await fetch('/api/notifications/read-all',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:makeUserId()})});if(!r.ok)throw Error('Failed');notificationCache=notificationCache.map(x=>({...x,read:true}));renderNotificationList();refreshNotificationBadge()}catch(e){toast(nt().error)}};try{const r=await fetch('/api/notifications?user_id='+encodeURIComponent(makeUserId())+'&lang='+encodeURIComponent(lang),{cache:'no-store'});if(!r.ok)throw Error('Failed');const j=await r.json();notificationCache=Array.isArray(j.notifications)?j.notifications:[];renderNotificationList()}catch(e){$('notificationList').textContent=nt().error}}
function renderNotificationList(){const box=$('notificationList');if(!box)return;if(!notificationCache.length){box.className='noti-empty';box.textContent=nt().empty;return}box.className='';box.innerHTML=notificationCache.map(n=>`<article class="noti-item ${n.read?'read':'unread'}" data-notification-id="${esc(n.id)}"><span class="noti-dot"></span><div class="noti-content"><b>${esc(n.title||'FLASH LIVE')}</b><p>${esc(n.body||'')}</p><time>${n.created_at?new Date(n.created_at).toLocaleString():''}</time></div></article>`).join('');box.querySelectorAll('[data-notification-id]').forEach(el=>el.addEventListener('click',async()=>{const id=el.dataset.notificationId;try{const r=await fetch('/api/notifications/'+encodeURIComponent(id)+'/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:makeUserId()})});if(!r.ok)throw Error('Failed');const n=notificationCache.find(x=>x.id===id);if(n)n.read=true;renderNotificationList();refreshNotificationBadge()}catch(e){toast(nt().error)}}))}

function playFlashStream(i){const x=tvStreams[i];if(!x)return;document.querySelectorAll('.tv-channel').forEach((b,n)=>b.classList.toggle('on',n===i));const p=$('tvPlayer');if(x.type==='mp4'||x.type==='m3u8'){p.innerHTML=`<video controls playsinline autoplay src="${esc(x.url)}"></video>`}else if(x.type==='youtube'){let u=x.url;try{const z=new URL(u);let id=z.hostname.includes('youtu.be')?z.pathname.slice(1):z.searchParams.get('v');if(id)u='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?autoplay=1'}catch{}p.innerHTML=`<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen src="${esc(u)}"></iframe>`}else{p.innerHTML=`<div class="tv-empty">${esc(x.title)}<br><a href="${esc(x.url)}" target="_blank" rel="noopener">${t('open')}</a></div>`}}
function loadFootballChannels(){const b=$('tvChannels');b.innerHTML=`<div class="em" style="grid-column:1/-1">${t('licensed_only')}</div>`}
function drawProfile(){const p=profile,uid=makeUserId();$('v4').innerHTML=`<div class="profile-head"><div class="profile-avatar">${p.avatar?`<img src="${esc(p.avatar)}" alt="Profile" style="width:100%;height:100%;object-fit:cover">`:esc((p.name||'U').slice(0,1).toUpperCase())}</div><div style="min-width:0"><b>${esc(p.name||t('profile'))}</b><small style="display:block;color:var(--dm);overflow-wrap:anywhere;word-break:break-word">${esc(p.email||'')}</small><button type="button" class="user-id" data-copy-id="${uid}">${t('account_id')}: ${uid} <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button></div></div><div class="cd"><button class="profile-row" id="editProfileBtn"><span class="profile-label">${icon('user')}<span>${t('edit_account')}<small>${t('edit_account_sub')}</small></span></span><b>›</b></button><button class="profile-row" id="helpBtn"><span class="profile-label">${icon('mail')}<span>${t('help_request')}<small>${t('help_sub')}</small></span></span><b>›</b></button><button class="profile-row" id="themeBtn"><span class="profile-label">${icon('sun')}<span>${t('appearance')}<small>${t('light')} / ${t('dark')}</small></span></span><b>${document.body.classList.contains('light')?t('light'):t('dark')}</b></button><div class="profile-row"><span class="profile-label">${icon('globe')}<span>${t('language')}</span></span><select id="profileLang" style="width:auto;margin:0">${LN.map(l=>`<option value="${l}" ${lang===l?'selected':''}>${NAMES[l]}</option>`).join('')}</select></div></div><div id="profilePanel"></div><div class="h3">${t('saved')}</div><div id="profileFav"></div>`;drawFavIntoProfile()}
function drawFavIntoProfile(){const el=$('profileFav');if(!el)return;let h=favT.map(x=>`<div class="li" data-team="${x.id}">${im(x.logo,'tl')}<div><b>${esc(x.name)}</b></div></div>`).join('');el.innerHTML=h||none()}
async function imageToDataURL(file,maxSide=2400,quality=.9){if(!file||!file.type.startsWith('image/'))throw new Error('ပုံဖိုင်ကိုသာ ရွေးပါ');const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('ပုံဖတ်မရပါ'));r.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('ပုံဖွင့်မရပါ'));im.src=src});const scale=Math.min(1,maxSide/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',quality)}
function profileEditor(){const p=$('profilePanel');p.innerHTML=`<div class="profile-form"><b>${t('profile_edit')}</b><div class="avatar-edit-preview" id="avatarPreview">${profile.avatar?`<img src="${esc(profile.avatar)}" alt="Profile photo">`:`<span>${esc((profile.name||'U').slice(0,1).toUpperCase())}</span>`}</div><label>${t('name')}</label><input id="pName" maxlength="80" value="${esc(profile.name)}"><label>${t('email')}</label><input id="pEmail" type="email" maxlength="160" value="${esc(profile.email)}"><label>${t('photo')}</label><input id="pAvatar" type="file" accept="image/*"><small class="form-hint">ပုံအရွယ်အစားကို အလိုအလျောက်ညှိပေးမည်။ ပုံကို ရွေးပြီး Preview ကြည့်နိုင်သည်။</small><button class="primary-action" id="saveProfile">${t('save')}</button></div>`}
async function loadSupportThread(){
 const box=$('supportThread');if(!box)return;
 try{
  const r=await fetch('/api/support/thread?user_id='+encodeURIComponent(makeUserId())+'&lang='+encodeURIComponent(lang),{cache:'no-store'});
  if(!r.ok)throw Error('thread');const j=await r.json();
  const all=[...(j.messages||[]).map(m=>({kind:'user',body:m.message,image:m.image,created_at:m.created_at||m.createdAt})),...(j.replies||[]).map(x=>({kind:'admin',body:x.body,created_at:x.created_at}))].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  box.innerHTML=all.length?all.map(x=>`<div class="support-bubble ${x.kind==='admin'?'admin':''}"><b>${x.kind==='admin'?'FLASH LIVE Support':'You'}</b><div>${esc(x.body||'')}</div>${x.image?`<img class="support-image" src="${esc(x.image)}" alt="Support attachment">`:''}<small>${x.created_at?new Date(x.created_at).toLocaleString(LOC[lang]||'en-US'):''}</small></div>`).join(''):`<div class="noti-empty">${lang==='my'?'အကူအညီစာ မရှိသေးပါ':'No messages yet'}</div>`;
 }catch(e){box.textContent=lang==='my'?'အကူအညီစာများ ရယူမရပါ':'Unable to load support messages'}
}
function supportEditor(){const p=$('profilePanel'),uid=makeUserId();p.innerHTML=`<div class="profile-form support-form"><div class="support-title">${icon('mail')}<b>${t('support')}</b></div><div class="support-account"><span class="support-avatar">${profile.avatar?`<img src="${esc(profile.avatar)}" alt="">`:esc((profile.name||'U').slice(0,1).toUpperCase())}</span><span class="support-account-text"><b>${esc(profile.name||'Account name not set')}</b><small>${esc(profile.email||'Account email not set')}</small><small class="support-id">${t('account_id')}: ${esc(uid)}</small></span></div><p class="form-hint">အကောင့်အချက်အလက်ကို အလိုအလျောက် ထည့်သွင်းပေးထားသည်။ ပြန်ဖြည့်ရန် မလိုပါ။</p><label>${t('message')}</label><textarea id="sMessage" rows="5" maxlength="4000" placeholder="${t('message')}..."></textarea><label>${t('image')}</label><input id="sImage" type="file" accept="image/*"><small class="form-hint">ပုံကို အလိုအလျောက် အရွယ်ညှိပြီး ပေးပို့မည်။</small><button class="primary-action" id="sendSupport">${t('send')}</button><div class="support-thread" id="supportThread"></div></div>`;loadSupportThread()}

async function checkApiQuota(){
  const b=$('apiQuotaBox');if(!b)return;b.innerHTML=load;
  try{
    const s=await api('status',5000);
    const sub=s.subscription||{},rq=s.requests||{};
    b.innerHTML=`<div style="padding:8px 0"><div class="kv"><span>Plan</span><b style="color:var(--g)">${esc(sub.plan||'Active')}</b></div><div class="kv"><span>Used Today / Limit</span><b>${num(rq.current||0)} / ${num(rq.limit_day||0)}</b></div><div class="kv"><span>Expires</span><b>${fmtD(sub.end)}</b></div></div>`;
  }catch(e){b.innerHTML=errBox(e)}
}

function setLang(l){
  lang=l;localStorage.setItem('FL_LANG',l);document.documentElement.lang=l;
  applyI();document.documentElement.lang=l;drawDates();if(fx.length)drawFx();
  if($('mm').classList.contains('open')&&M){drawTabs();head();drawTab()}
  if($('sm').classList.contains('open')&&subStack.length)subStack[subStack.length-1]();
  drawView();
}
function applyI(){document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph))}
function setTz(v){let s={};try{s=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}s.tzMode=v;localStorage.setItem(CK,JSON.stringify(s));cache.clear();day=today();drawDates();loadFx()}

let qt;
$('qi').oninput=e=>{
  clearTimeout(qt);const q=e.target.value.trim(),b=$('qr');
  if(q.length<3){b.innerHTML='';return}
  qt=setTimeout(async()=>{
    b.innerHTML=load;
    try{
      const [T,L]=await Promise.all([api(`teams?search=${enc(q)}`,6e5).catch(()=>[]),api(`leagues?search=${enc(q)}`,6e5).catch(()=>[])]);
      b.innerHTML=(T.length?`<div class="h3">${t('teams')}</div><div class="cd">${T.slice(0,12).map(x=>`<div class="li" data-team="${x.team.id}">${im(x.team.logo,'tl')}<div><b>${esc(x.team.name)}</b><small>${esc(x.team.country||'')}</small></div></div>`).join('')}</div>`:'')+
      (L.length?`<div class="h3">${t('lg')}</div><div class="cd">${L.slice(0,12).map(l=>`<div class="li" data-lg="${l.league.id}" data-s="${(l.seasons.find(s=>s.current)||{}).year||''}">${im(l.league.logo,'lt')}<div><b>${esc(l.league.name)}</b><small>${esc(l.country.name||'')}</small></div></div>`).join('')}</div>`:'')||none();
    }catch(e){b.innerHTML=errBox(e)}
  },400);
};
$('lq').oninput=()=>drawLeagues();

document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);let x;
  if(x=g('[data-lg]')){e.stopPropagation();return openLeague(+x.dataset.lg,+x.dataset.s||0)}
  if(x=g('[data-lh]')){x.parentElement.classList.toggle('cl');const b=$('list');(b._c=b._c||{})[x.dataset.lh]=x.parentElement.classList.contains('cl');return}
  if(x=g('[data-fx]'))return openMatch(x.dataset.fx);
  if((x=g('[data-pl]'))&&x.dataset.pl)return openPlayer(+x.dataset.pl,+x.dataset.s||0);
  if((x=g('[data-coach]'))&&x.dataset.coach)return openCoach(+x.dataset.coach);
  if((x=g('[data-team]'))&&x.dataset.team)return openTeam(+x.dataset.team);
  if(x=g('[data-ptab]'))return renderPlayer(+x.dataset.plid,+x.dataset.pls||0,x.dataset.ptab);
  if(x=g('[data-ttab]'))return renderTeam(+x.dataset.tmid,x.dataset.ttab);
  if(x=g('[data-ltab]'))return renderLeague(+x.dataset.lgid,+x.dataset.lgs||0,x.dataset.ltab);
  if(x=g('[data-ncat]')){ncat=x.dataset.ncat;return drawNews()}
  if(x=g('[data-tm]')){tmode=x.dataset.tm;return drawTable()}
  if(g('[data-colall]')){const bx=$('list');bx._c=bx._c||{};const ids=[...new Set(fx.map(m=>m.league.id))],all=ids.every(i=>bx._c[i]);ids.forEach(i=>bx._c[i]=!all);return drawFx()}
  if(x=g('[data-day]'))return pick(x.dataset.day);
  if(x=g('[data-tab]'))return setTab(x.dataset.tab);
  if(x=g('[data-mode]')){mode=x.dataset.mode;return drawTab()}
  if(g('[data-aisum]'))return aiSum();
  if(x=g('[data-lang]'))return setLang(x.dataset.lang);
  if(x=g('[data-v]'))return nav(x.dataset.v);
  if(x=g('[data-tv-mode]')){tvMode=x.dataset.tvMode;return drawTV()}
  if(x=g('[data-stream-index]'))return playFlashStream(+x.dataset.streamIndex);
  if(x=g('[data-copy-id]')){const id=x.dataset.copyId;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(id).then(()=>toast('ID copied')).catch(()=>toast(id));else toast(id);return}if(g('#editProfileBtn'))return profileEditor();
  if(g('#helpBtn'))return supportEditor();
  if(g('#themeBtn')){document.body.classList.toggle('light');localStorage.setItem('FLASH_LIVE_THEME',document.body.classList.contains('light')?'light':'dark');return drawProfile()}
  if(x=g('[data-close]'))return $(x.dataset.close).classList.remove('open');
  if(g('#chkApiBtn'))return checkApiQuota();
  if(g('#clrCacheBtn')){cache.clear();localStorage.removeItem('FL_FX');toast('✓ Cache Cleared');return loadFx()}
  if(g('#saveProfile')){const file=$('pAvatar').files[0];(async()=>{try{const data=file?await imageToDataURL(file,2400,.9):profile.avatar;profile={...profile,name:$('pName').value.trim(),email:$('pEmail').value.trim(),avatar:data};localStorage.setItem('FLASH_LIVE_PROFILE',JSON.stringify(profile));$('profilePanel').innerHTML='';drawProfile();toast(t('saved_ok'))}catch(e){toast(e.message)}})();return}if(g('#sendSupport')){const msg=$('sMessage').value.trim(),file=$('sImage').files[0];if(!msg&&!file)return toast('စာ သို့မဟုတ် ပုံ ထည့်ပါ');const send=async image=>{try{const r=await fetch('/api/support/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:makeUserId(),name:profile.name||'',email:profile.email||'',avatar:profile.avatar||null,message:msg,image,language:lang})});const j=await r.json();if(!r.ok)throw new Error(j.message||'ပေးပို့မရပါ');toast(j.acknowledgement||t('support_ok'));loadSupportThread()}catch(e){toast(e.message)}};if(file){imageToDataURL(file,2400,.88).then(send).catch(e=>toast(e.message))}else send(null);return}
  if(g('#homeBtn')){nav('matches');return pick(today())}
});

document.addEventListener('change',e=>{
  if(e.target.id==='aiu'){let c={};try{c=JSON.parse(localStorage.getItem(CK)||'{}')}catch(x){}c.aiUrl=e.target.value.trim();localStorage.setItem(CK,JSON.stringify(c))}
  if(e.target.id==='tzs')setTz(e.target.value);
  if(e.target.id==='dp'&&e.target.value)pick(e.target.value);
  if(e.target.id==='profileLang')setLang(e.target.value);
});

$('notificationBtn').onclick=()=>{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();notificationAudioReady=true;openNotifications()};
$('lv').onclick=()=>{liveOnly=!liveOnly;$('lv').classList.toggle('on',liveOnly);drawDates();loadFx()};
$('fb').onclick=()=>pick(today());
$('sb').onclick=()=>{show('qm');$('qi').focus()};
setInterval(()=>{refreshNotificationBadge();if($('supportThread'))loadSupportThread();if(view==='matches'&&!document.hidden&&(liveOnly||day===today()))loadFx(true)},60000);

document.documentElement.lang=lang;
if(localStorage.getItem('FLASH_LIVE_THEME')==='light')document.body.classList.add('light');
applyI();
drawDates();
loadFx();
refreshNotificationBadge();
refreshNotificationBadge();setInterval(()=>{if(!document.hidden)refreshNotificationBadge()},45000);
</script>
