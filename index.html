<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FLASH LIVE - Global Football & Live TV</title>
    <style>
        :root {
            --bg-main: #080b10;
            --bg-surface: #10151f;
            --bg-card: #151c28;
            --accent: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.28);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #222c3f;
            --danger: #ef4444;
        }
        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 66px;
            overflow-x: hidden;
            font-size: 12px;
        }
        .top-header {
            background: linear-gradient(145deg, #151b26, #0c1017);
            padding: 8px 12px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 14px rgba(0,0,0,0.7);
            height: 48px;
        }
        .brand-wrap { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .brand-title {
            font-size: 16px; font-weight: 900; letter-spacing: 0.8px; font-style: italic;
            background: linear-gradient(90deg, #ffffff 0%, #00e676 60%, #ffea00 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-btns { display: flex; align-items: center; gap: 6px; }
        .btn-3d-pill {
            background: linear-gradient(145deg, #1c2433, #111620);
            border: 1px solid #283347; color: var(--text-primary);
            height: 28px; padding: 0 10px; border-radius: 14px;
            font-size: 11px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            cursor: pointer; box-shadow: 2px 2px 5px #05070a, -1px -1px 4px #222c3f;
        }
        .btn-3d-pill.active-green {
            background: linear-gradient(145deg, #00e676, #00b359);
            color: #05080c; border-color: #00e676;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #ff3030; flex-shrink: 0; }
        .date-bar {
            display: flex; overflow-x: auto; gap: 6px; padding: 7px 10px;
            background: #0b0f16; border-bottom: 1px solid #192130; scrollbar-width: none;
        }
        .date-bar::-webkit-scrollbar { display: none; }
        .date-chip {
            background: linear-gradient(145deg, #161d2a, #0f141d);
            border: 1px solid #212b3d; border-radius: 9px;
            padding: 4px 9px; min-width: 60px; text-align: center; cursor: pointer; flex-shrink: 0;
        }
        .date-chip .d-txt { font-size: 10px; color: var(--text-secondary); font-weight: 700; display: block; }
        .date-chip .d-num { font-size: 11px; color: var(--text-primary); font-weight: 800; display: block; margin-top: 1px; }
        .date-chip.active {
            background: linear-gradient(145deg, #00e676, #00b85c);
            border-color: #00e676; box-shadow: 0 2px 8px var(--accent-glow);
        }
        .date-chip.active .d-txt, .date-chip.active .d-num { color: #05080c; }
        .search-wrap { padding: 8px 10px 4px 10px; }
        .search-bar-3d {
            display: flex; align-items: center; background: #0d121a;
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 0 10px; height: 34px; box-shadow: inset 2px 2px 5px #05070a;
        }
        .search-bar-3d input {
            background: transparent; border: none; outline: none;
            color: var(--text-primary); font-size: 12px; width: 100%; margin-left: 8px;
        }
        .main-feed { padding: 8px 10px; }
        .league-card {
            background: linear-gradient(145deg, #151c28, #0f141d);
            border: 1px solid var(--border-color); border-radius: 12px;
            margin-bottom: 10px; overflow: hidden; box-shadow: 3px 3px 9px #05070a;
        }
        .league-head {
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(145deg, #192130, #121822);
            border-bottom: 1px solid #1f293a; cursor: pointer;
        }
        .league-head-left { display: flex; align-items: center; gap: 8px; }
        .flag-icon { width: 18px; height: 18px; border-radius: 50%; object-fit: contain; background: #1e293b; }
        .league-title { font-size: 12px; font-weight: 800; color: var(--text-primary); }
        .count-pill {
            background: #0a0e14; color: var(--accent); font-size: 10px; font-weight: 800;
            padding: 2px 7px; border-radius: 8px; border: 1px solid #222d40;
        }
        .match-row {
            padding: 9px 10px; display: grid; grid-template-columns: 36px 1fr 64px 1fr;
            align-items: center; border-bottom: 1px solid rgba(255,255,255,0.035); cursor: pointer;
        }
        .match-row:last-child { border-bottom: none; }
        .match-row:active { background: rgba(0, 230, 118, 0.08); }
        .status-badge { font-size: 10px; font-weight: 800; color: var(--text-secondary); text-align: center; }
        .status-badge.live {
            background: var(--accent); color: #04080c; padding: 2px 4px;
            border-radius: 6px; font-weight: 900;
        }
        .team-cell { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; line-height: 1.2; }
        .team-cell.home { justify-content: flex-end; text-align: right; }
        .team-cell.away { justify-content: flex-start; text-align: left; }
        .club-logo { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
        .score-center { text-align: center; font-size: 13px; font-weight: 900; color: #fff; }
        .time-center { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); }
        .tv-switch-bar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
            background: #0d121a; padding: 5px; border-radius: 12px; border: 1px solid var(--border-color);
        }
        .tv-tab-btn {
            padding: 9px; text-align: center; font-size: 12px; font-weight: 900;
            border-radius: 9px; cursor: pointer; color: var(--text-secondary);
        }
        .tv-tab-btn.active {
            background: linear-gradient(145deg, #00e676, #00b359);
            color: #05080c; box-shadow: 0 3px 10px var(--accent-glow);
        }
        .video-card-3d {
            background: linear-gradient(145deg, #161d2a, #0f141d);
            border: 1px solid var(--border-color); border-radius: 14px;
            overflow: hidden; margin-bottom: 12px; box-shadow: 4px 4px 12px #05070a;
        }
        .video-thumb-wrap {
            position: relative; width: 100%; height: 190px;
            background: #05070a; overflow: hidden; cursor: pointer;
        }
        .video-thumb-wrap img, .video-thumb-wrap video { width: 100%; height: 100%; object-fit: cover; }
        .live-tag-overlay {
            position: absolute; top: 10px; left: 10px; background: #ef4444; color: #fff;
            font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 6px;
        }
        .play-btn-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.35);
        }
        .play-circle {
            width: 48px; height: 48px; border-radius: 50%; background: rgba(0, 230, 118, 0.92);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,230,118,0.5);
        }
        .detail-modal {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 250;
            display: none; flex-direction: column; overflow-y: auto;
        }
        .detail-modal.show { display: flex; }
        .detail-header {
            background: linear-gradient(145deg, #171f2c, #0e131b);
            padding: 10px 12px 14px 12px; border-bottom: 1px solid var(--border-color);
        }
        .detail-top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .detail-scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; }
        .d-club img { width: 42px; height: 42px; object-fit: contain; margin-bottom: 4px; }
        .d-club-name { font-size: 12px; font-weight: 800; }
        .d-score { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .d-state { font-size: 11px; color: var(--accent); font-weight: 800; }
        .d-subtabs {
            display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: #0f141d;
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 20;
            width: 100%;
        }
        .d-subtab {
            padding: 10px 2px; font-size: 11px; font-weight: 800; color: var(--text-secondary);
            text-align: center; white-space: nowrap; cursor: pointer; border-bottom: 2.5px solid transparent;
            overflow: hidden; text-overflow: ellipsis;
        }
        .d-subtab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .detail-body { padding: 10px; flex: 1; }
        .box-3d {
            background: linear-gradient(145deg, #151c28, #0f141d);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 12px; margin-bottom: 10px; box-shadow: 3px 3px 8px #05070a;
        }
        .box-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
        .fact-grid { display: grid; gap: 8px; }
        .fact-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; background: rgba(255,255,255,0.025); border: 1px solid rgba(148,163,184,0.1); font-size: 11.5px; }
        .fact-label { color: var(--text-secondary); font-weight: 700; }
        .fact-val { color: var(--text-primary); font-weight: 800; text-align: right; }
        .form-pills { display: inline-flex; gap: 3px; }
        .form-pill { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 9px; font-weight: 900; color: #04110b; }
        .form-pill.W { background: #00e676; }
        .form-pill.D { background: #94a3b8; }
        .form-pill.L { background: #ef4444; color: #fff; }
        .event-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 4px; border-bottom: 1px solid rgba(148,163,184,0.1); font-size: 11.5px; }
        .event-row:last-child { border-bottom: none; }
        .event-minute { min-width: 36px; padding: 2px 6px; border-radius: 6px; background: rgba(0,230,118,0.14); color: var(--accent); font-weight: 900; text-align: center; font-size: 10.5px; }
        .pitch-box {
            background: linear-gradient(180deg, #0d4a2e 0%, #13653f 50%, #0d4a2e 100%);
            border: 1.5px solid rgba(255,255,255,0.22); border-radius: 12px; padding: 12px 6px;
        }
        .pitch-row { display: flex; justify-content: space-around; align-items: center; margin: 10px 0; flex-wrap: wrap; gap: 8px; }
        .player-chip { text-align: center; width: 62px; }
        .player-chip img {
            width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
            border: 1.5px solid #fff; background: #1e293b;
        }
        .player-chip span {
            display: block; font-size: 10px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
            background: linear-gradient(180deg, #141a24, #0b0f15);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 150; box-shadow: 0 -4px 16px rgba(0,0,0,0.8);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; color: var(--text-secondary); font-size: 10px; font-weight: 700;
            cursor: pointer; flex: 1; height: 100%;
        }
        .nav-item.active { color: var(--accent); }
        .nav-svg { width: 19px; height: 19px; fill: currentColor; }

        /* FLASH LIVE UI refinement */
        .matchday-hero{margin:7px 10px 6px;padding:9px 12px;border:1px solid rgba(0,230,118,.24);border-radius:16px;background:radial-gradient(circle at 90% 10%,rgba(0,230,118,.16),transparent 38%),linear-gradient(135deg,#172331,#0b1119 72%);position:relative;overflow:hidden}
        .matchday-hero:after{content:"";position:absolute;right:-34px;bottom:-52px;width:150px;height:150px;border:1px solid rgba(0,230,118,.10);border-radius:50%;box-shadow:0 0 0 12px rgba(0,230,118,.025),0 0 0 25px rgba(0,230,118,.018)}
        .hero-kicker{font-size:8px;letter-spacing:1.5px;font-weight:900;color:var(--accent);margin-bottom:3px}
        .hero-title{font-size:16px;font-weight:950;line-height:1.1;letter-spacing:-.3px}
        .hero-title span{color:var(--accent)}
        .hero-sub{display:none}
        .hero-foot{display:flex;align-items:center;gap:8px;margin-top:6px;position:relative;z-index:1}
        .api-state{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:20px;background:#0a1713;border:1px solid rgba(0,230,118,.2);font-size:9px;font-weight:800;color:#8cf5bd}
        .api-state .state-dot{width:6px;height:6px;border-radius:50%;background:#64748b}
        .api-state.online .state-dot{background:#00e676;box-shadow:0 0 8px #00e676}
        .api-state.offline{color:#fca5a5;background:#1b1012;border-color:#7f1d1d}
        .hero-refresh{margin-left:auto;border:1px solid #314155;background:#172231;color:#e2e8f0;border-radius:9px;padding:6px 9px;font-size:10px;font-weight:800;cursor:pointer}
        .section-heading{display:flex;align-items:center;justify-content:space-between;padding:7px 2px 8px}
        .section-heading strong{font-size:13px;letter-spacing:.2px}
        .section-heading small{font-size:9px;color:var(--text-secondary)}
        .match-row{min-height:58px;transition:background .15s ease;cursor:pointer}.match-row:active{background:rgba(0,230,118,.07)}
        .league-card{box-shadow:0 7px 20px rgba(0,0,0,.22)}
        .league-head{min-height:42px}
        .date-chip{min-width:64px;padding:6px 10px}
        .search-bar-3d:focus-within{border-color:rgba(0,230,118,.65);box-shadow:0 0 0 2px rgba(0,230,118,.08)}
        .btn-3d-pill,.date-chip,.nav-item,.tv-tab-btn,.d-subtab{user-select:none}
        .bottom-nav{padding-bottom:env(safe-area-inset-bottom);height:calc(56px + env(safe-area-inset-bottom))}
        body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
        @media(min-width:700px){body{max-width:900px;margin:0 auto;border-left:1px solid #1c2635;border-right:1px solid #1c2635}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,900px)}.main-feed{padding:12px 16px}.matchday-hero{margin:9px 16px 7px;padding:11px 14px}.hero-title{font-size:18px}}
        @media(max-width:360px){.brand-title{font-size:13px}.header-btns{gap:4px}.btn-3d-pill{padding:0 8px}.match-row{grid-template-columns:34px minmax(0,1fr) 54px minmax(0,1fr);padding:8px 7px}.team-cell{font-size:10px;gap:4px}.club-logo{width:17px;height:17px}}

        .profile-shell{display:grid;gap:12px;padding:8px 0 18px}
        .profile-card{background:linear-gradient(145deg,#151d29,#0d131d);border:1px solid #263348;border-radius:15px;padding:15px;box-shadow:0 8px 22px rgba(0,0,0,.2)}
        .profile-head{display:flex;align-items:center;gap:12px}
        .profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00e676,#079b69);color:#03130c;font-size:22px;font-weight:900;overflow:hidden;flex-shrink:0}
        .profile-avatar img{width:100%;height:100%;object-fit:cover}
        .profile-name{font-size:15px;font-weight:900}.profile-muted{font-size:11px;color:#94a3b8;margin-top:4px}
        .profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
        .profile-action{border:1px solid #2b394e;background:#111a27;color:#e8eef7;border-radius:10px;padding:11px 10px;text-align:left;font-size:12px;font-weight:750;display:flex;align-items:center;gap:8px;min-height:43px;cursor:pointer}
        .profile-action:active{border-color:var(--accent)}
        .profile-section-title{font-size:12px;font-weight:900;color:var(--accent);margin-bottom:10px;letter-spacing:.2px}
        .profile-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid rgba(148,163,184,.12);font-size:12px}
        .profile-row select,.profile-row input{background:#0a111b;border:1px solid #2a374b;color:#f8fafc;border-radius:8px;padding:8px;max-width:56%;font-size:11px}
        .profile-row input[type=checkbox]{accent-color:#00e676;width:18px;height:18px}
        .profile-primary{background:linear-gradient(135deg,#00e676,#00b86b);border:0;color:#04110a;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer}
        .profile-secondary{background:#111a27;border:1px solid #304057;color:#e5edf7;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer}
        .profile-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.78);padding:18px;align-items:center;justify-content:center}
        .profile-modal.show{display:flex}.profile-modal-card{width:min(100%,440px);max-height:88vh;overflow:auto;background:#101824;border:1px solid #2b3b50;border-radius:17px;padding:16px;box-shadow:0 18px 60px #000}
        .profile-modal-card h3{font-size:15px;margin-bottom:13px}.profile-field{width:100%;margin:6px 0 10px;padding:11px;border-radius:9px;background:#080e16;border:1px solid #2a374b;color:#fff;font-size:13px;outline:none}
        .profile-modal-actions{display:flex;gap:8px;margin-top:10px}.profile-modal-actions>*{flex:1}
        .support-note{font-size:10px;color:#94a3b8;line-height:1.5;margin:8px 0}
        @media(max-width:360px){.profile-actions{grid-template-columns:1fr}.profile-card{padding:12px}}

        .brand-mark{width:42px;height:42px;border-radius:13px;padding:1px;background:linear-gradient(145deg,#253b34,#07110e 55%,#14251f);border:1.5px solid rgba(0,255,102,.85);box-shadow:inset 0 0 8px rgba(0,255,102,.25),0 0 14px rgba(0,230,118,.32);overflow:hidden;flex-shrink:0;display:grid;place-items:center}
        .brand-mark svg{width:100%;height:100%;display:block}
        .menu-trigger{width:31px;height:28px;border:1px solid #2a394b;border-radius:9px;background:linear-gradient(145deg,#202b3b,#0c121b);display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:2px 2px 5px #05070a,-1px -1px 4px #263244;cursor:pointer}
        .menu-trigger span{width:3px;height:3px;border-radius:50%;background:#dce7e3}
        .quick-menu-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:180;backdrop-filter:blur(3px)}
        .quick-menu{display:none;position:fixed;z-index:181;top:58px;right:10px;width:min(310px,calc(100vw - 24px));padding:12px;border:1px solid rgba(0,230,118,.42);border-radius:16px;background:linear-gradient(145deg,#202b38,#0b1119 75%);box-shadow:0 16px 42px #000,inset 0 1px rgba(255,255,255,.08)}
        .quick-menu.show,.quick-menu-backdrop.show{display:block}
        .quick-menu-head{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 10px;border-bottom:1px solid #2a3746;margin-bottom:5px;font-size:13px;color:#eaf5ef}
        .quick-menu-head button{background:none;border:0;color:#dce7e3;font-size:25px;line-height:1;cursor:pointer}
        .quick-menu-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 8px;border:0;border-bottom:1px solid rgba(148,163,184,.13);background:transparent;color:#e6edf4;text-align:left;font-size:12px;font-weight:700;cursor:pointer}
        .quick-menu-item:last-child{border-bottom:0}.quick-menu-item b{color:var(--accent);font-size:17px}
        .menu-switch{width:28px;height:15px;border-radius:20px;background:#394657;position:relative;display:inline-block}.menu-switch:after{content:'';position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#dce5e8;transition:.2s}.menu-switch.on{background:#087d4c}.menu-switch.on:after{left:15px;background:#fff}
        .league-head .collapse-mark{color:var(--accent);font-size:16px;font-weight:700}
        .league-card.collapsed .match-row{display:none}.league-card.collapsed .league-head{border-bottom:0}
        .fav-mark{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

        /* Final UI pass: compact, clear, mobile-first */
        .top-header{height:54px;padding:7px 12px}
        .header-icon{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .live-indicator{color:#00e676!important}
        .live-indicator .dot-live{background:#ff3030!important;opacity:.85}
        .live-indicator.has-live .dot-live{opacity:1;box-shadow:0 0 8px #ff3030,0 0 14px rgba(255,48,48,.65);animation:livePulse 1.1s infinite ease-in-out}
        @keyframes livePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.35;box-shadow:0 0 2px #ff3030}}
        .notification-trigger{width:32px;padding:0}
        .search-wrap{position:sticky;top:54px;z-index:95;padding:8px 10px;background:var(--bg-main)}
        .date-bar{position:relative;top:auto;z-index:94}
        .search-bar-3d{height:42px;border-radius:12px}
        .search-bar-3d input{font-size:13px}
        .date-chip{min-width:66px;padding:7px 10px}

function getLeagueName(lg) {
    if (!lg) return 'Football';
    if (lg.names) return lg.names[lang] || lg.names.en || lg.names.my;
    const found = MAJOR_LEAGUES.find(x => x.code === lg.code || x.code === lg.leagueCode);
    if (found) return found.names[lang] || found.names.en;
    return lg.leagueName || lg.name || 'Football';
}

async function checkBackendHealth(){
    const pill=document.getElementById('apiState'),label=document.getElementById('apiStateText');
    try{
        const r=await fetch(`${API_BASE_URL}/api/health`,{cache:'no-store'});
        const d=await r.json();
        if(r.ok&&d.status==='ok'){backendOnlineState=true;pill.classList.add('online');pill.classList.remove('offline');label.textContent=tr('srv_online');return true;}
        throw new Error('Backend unavailable');
    }catch(e){
        backendOnlineState=false;
        if(pill){pill.classList.remove('online');pill.classList.add('offline');}
        if(label)label.textContent=tr('srv_offline')||'Server ချိတ်ဆက်မရပါ';
        return false;
    }
}

        let label=d.toLocaleDateString(localeCode,{weekday:'short'});
        if(i===0)label=tr('today');else if(i===-1)label=tr('yesterday');else if(i===1)label=tr('tomorrow');

}

function getProviderMatches(payload){
    const roots=[payload?.response,payload?.data,payload?.result,payload].filter(Boolean);
    const out=[];
    const add=(items,league)=>{
        if(!Array.isArray(items))return;
        items.forEach(match=>{if(match&&typeof match==='object')out.push({match,league:league||match.league||{name:match.leagueName||match.tournament?.name||'Football'}});});
    };
    for(const root of roots){
        if(Array.isArray(root)){root.forEach(group=>add(group?.matches||group?.events,group?.league||group));}
        add(root?.matches,root?.league||{name:root?.leagueName||'Football'});
        add(root?.fixtures,root?.league||{name:root?.leagueName||'Football'});
        add(root?.events,root?.league||{name:root?.leagueName||'Football'});
        add(root?.live,root?.league||{name:'Live Football'});
        if(root?.data&&Array.isArray(root.data))add(root.data,root.league||{name:root.leagueName||'Football'});
    }
    const seen=new Set();
    return out.filter(x=>{
        const id=x.match.id??x.match.fixture?.id??x.match.eventId;
        if(id==null||seen.has(String(id)))return false;
        seen.add(String(id));return true;
    });
}
function storeProviderMatch(match,league){
    const fixture=match.fixture||match;
    const teams=match.teams||{};
    const home=match.home||teams.home||match.homeTeam||fixture.homeTeam;
    const away=match.away||teams.away||match.awayTeam||fixture.awayTeam;
    const homeName=typeof home==='string'?home:(home?.name||home?.shortName||'');
    const awayName=typeof away==='string'?away:(away?.name||away?.shortName||'');
    const id=match.id??fixture.id??match.eventId;
    if(id==null||!homeName||!awayName)return;
    const key=String(id);if(matchMap[key])return;
    const rawStatus=match.status||fixture.status||{};
    const statusText=String(rawStatus.type?.shortDetail||rawStatus.short||rawStatus.name||rawStatus||'').toLowerCase();
    const isCancelled=/cancel|postpon|abandon/.test(statusText);
    const isFinished=/finish|full.?time|ft/.test(statusText)||rawStatus.finished===true;
    const isLive=/live|in.?play|half.?time|1st|2nd/.test(statusText)||rawStatus.started===true&&!isFinished&&!isCancelled;
    const utcTime=rawStatus.utcTime||fixture.date||match.utcTime||match.date||null;
    let displayStatus=isCancelled?'PP':isFinished?'FT':isLive?(rawStatus.liveTime?.short||rawStatus.displayClock||'LIVE'):
        (utcTime&&!Number.isNaN(new Date(utcTime).getTime())?new Date(utcTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):(match.time||'Scheduled'));
    const leagueObj=league||match.league||{};
    const countryCode=String(leagueObj.ccode||leagueObj.countryCode||'').toLowerCase();
    const flag=/^[a-z]{2}$/.test(countryCode)?`https://flagcdn.com/w80/${countryCode}.png`:'https://flagcdn.com/w80/un.png';
    const homeScore=home?.score??match.homeScore??match.goals?.home??null;
    const awayScore=away?.score??match.awayScore??match.goals?.away??null;
    const obj={
        id:key,source:'flash-live-backend',
        leagueId:String(match.leagueId||leagueObj.id||''),leagueCode:String(match.leagueCode||leagueObj.code||''),
        leagueName:leagueObj.name||leagueObj.leagueName||match.leagueName||'Football',
        order:Number(leagueObj.order||20),flag,
        homeName,awayName,
        homeLogo:home?.logo||home?.imageUrl||home?.crest||'',
        awayLogo:away?.logo||away?.imageUrl||away?.crest||'',
        homeScore:(isLive||isFinished)?homeScore:null,
        awayScore:(isLive||isFinished)?awayScore:null,
        isLive,isFinished,isCancelled,displayStatus,scorers:'',venue:'',
        tournamentStage:match.tournamentStage||'',utcTime
    };
    matchMap[key]=obj;rawMatchesCache.push(obj);
}
function storeEspnEvent(ev, lg) {
    if (!ev?.id || !ev?.competitions?.[0]) return;
    const id = String(ev.id);
    if (matchMap[id]) return;
    const comp = ev.competitions[0];
    const competitors = comp.competitors || [];
    const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
    const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
    if (!home || !away) return;

    const st = comp.status || ev.status || {};
    const stType = st.type || {};
    const state = stType.state || 'pre';
    const isLive = state === 'in';
    const isFinished = state === 'post' && !String(stType.shortDetail || '').toLowerCase().includes('ppd');
    const isCancelled = state === 'post' && String(stType.shortDetail || '').toLowerCase().includes('ppd');

    let displayStatus = '';
    if (isCancelled) displayStatus = 'PP';
    else if (isLive) displayStatus = st.displayClock || stType.shortDetail || 'LIVE';
    else if (isFinished) displayStatus = stType.shortDetail || 'FT';
    else if (ev.date) displayStatus = new Date(ev.date).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    else displayStatus = 'Scheduled';

    const details = comp.details || [];
    const scorers = details
        .filter(d => d.scoringPlay)
        .map(d => {
            const p = d.athletesInvolved?.[0]?.shortName || d.athletesInvolved?.[0]?.displayName || '';
            const clk = d.clock?.displayValue || '';
            return p ? `⚽ ${p} (${clk})` : '';
        })
        .filter(Boolean)
        .join(' • ');

    const obj = {
        id,
        source: 'espn',
        leagueId: lg.code,
        leagueCode: lg.code,
        leagueName: getLeagueName(lg),
        order: lg.order,
        flag: lg.flag,
        homeName: home.team?.shortDisplayName || home.team?.displayName || 'Home',
        awayName: away.team?.shortDisplayName || away.team?.displayName || 'Away',
        homeLogo: home.team?.logo || home.team?.logos?.[0]?.href || '',
        awayLogo: away.team?.logo || away.team?.logos?.[0]?.href || '',
        homeScore: (isLive || isFinished) ? (home.score ?? '0') : null,
        awayScore: (isLive || isFinished) ? (away.score ?? '0') : null,
        isLive,
        isFinished,
        isCancelled,
        displayStatus,
        scorers,
        venue: comp.venue?.fullName || '',
        attendance: comp.attendance ? comp.attendance.toLocaleString() : '',
        formHome: home.form || 'WWDLW',
        formAway: away.form || 'WDWLW',
        rawDetails: details,
        utcTime: ev.date || null
    };
    matchMap[id] = obj;
    rawMatchesCache.push(obj);
}

async function fetchRealMatches(){
    if(activeNav!=='matches')return;
    const feed=document.getElementById('mainFeed');
    feed.innerHTML=`<div class="box-3d" style="text-align:center;color:var(--accent);">${tr('loading')}</div>`;
    rawMatchesCache=[];matchMap={};

    const espnJobs = MAJOR_LEAGUES.map(async lg => {
        try {
            const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg.code}/scoreboard?dates=${selectedDateStr}`);
            if (!r.ok) return;
            const d = await r.json();
            (d.events || []).forEach(ev => storeEspnEvent(ev, lg));
        } catch (e) {}
    });

    const backendJob = (async () => {
        try {
            const res = await fetch(`${API_BASE_URL}/api/fixtures?date=${encodeURIComponent(selectedDateStr)}`);
            if (res.ok) {
                const payload = await res.json();
                getProviderMatches(payload).forEach(item => storeProviderMatch(item.match, item.league));
            }
        } catch (e) {}
    })();

    await Promise.all([...espnJobs, backendJob]);
    updateLiveDotState();

    if(!rawMatchesCache.length){
        const offline=!backendOnlineState;
        feed.innerHTML=`<div class="box-3d" style="text-align:center;padding:22px 14px;color:var(--text-secondary);">
            <div style="font-size:25px;margin-bottom:8px;">${offline?'⚠':'⚽'}</div>

function renderMatchesList(){
    if(activeNav!=='matches')return;
    const feed=document.getElementById('mainFeed'),q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
    rawMatchesCache.forEach(m=>{
        const foundLg = MAJOR_LEAGUES.find(x => x.code === m.leagueCode);
        if (foundLg) m.leagueName = getLeagueName(foundLg);
    });
    const filtered=rawMatchesCache.filter(m=>(showFinishedMatches||!m.isFinished)&&(!liveOnly||m.isLive)&&(!selectedLeagueCode||m.leagueCode===selectedLeagueCode)&&(!q||(m.homeName.toLowerCase().includes(q)||m.awayName.toLowerCase().includes(q)||m.leagueName.toLowerCase().includes(q))));
    if(!filtered.length){
        const resetBtn = selectedLeagueCode ? `<div style="margin-top:8px;"><button class="btn-3d-pill active-green" onclick="selectedLeagueCode=null;renderMatchesList()">${tr('clear_filter')}</button></div>` : '';
        feed.innerHTML=`<div class="box-3d" style="text-align:center;color:var(--text-secondary);">${tr('no_matches')}${resetBtn}</div>`;
        return;
    }
    const groups={};
    filtered.forEach(m=>{
        if(!groups[m.leagueName])groups[m.leagueName]={name:m.leagueName,flag:m.flag,order:m.order,matches:[]};
        groups[m.leagueName].matches.push(m);
    });
    const sortedGroups=Object.values(groups).sort((a,b)=>a.order-b.order),favMatches=filtered.filter(m=>favClubs.includes(m.homeName)||favClubs.includes(m.awayName));
    let html='';
    if (selectedLeagueCode) {
        html += `<div style="margin-bottom:8px;display:flex;justify-content:flex-end;"><button class="btn-3d-pill" onclick="selectedLeagueCode=null;renderMatchesList()">${tr('clear_filter')}</button></div>`;
    }
    if(favMatches.length)html+=`<div class="league-card" style="border-color:var(--accent);"><div class="league-head"><div class="league-head-left"><span class="fav-mark"></span><span class="league-title">${tr('fav_title')}</span></div><span class="count-pill">${favMatches.length}</span></div>${favMatches.map(m=>renderMatchRowHtml(m,true)).join('')}</div>`;
    sortedGroups.forEach(g=>{html+=`<div class="league-card"><div class="league-head"><div class="league-head-left"><img class="flag-icon" src="${g.flag}"><span class="league-title">${g.name}</span></div><span style="display:flex;align-items:center;gap:10px"><span class="count-pill">${g.matches.length}</span><span class="collapse-mark">－</span></span></div>${g.matches.map(m=>renderMatchRowHtml(m,false)).join('')}</div>`;});
    feed.innerHTML=html;

}

function parseStreamUrl(url){
    const match=url.match(/(?:youtube\.com\/(?:watch\?.*v=|live\/|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if(match&&match[1])return{type:'youtube',id:match[1],thumb:`https://img.youtube.com/vi/${match[1]}/hqdefault.jpg`,embed:`https://www.youtube-nocookie.com/embed/${match[1]}?autoplay=1&playsinline=1&rel=0&enablejsapi=1${/^https?:$/.test(location.protocol)?'&origin='+encodeURIComponent(location.origin):''}`};
    if(url.match(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i))return{type:'direct',embed:url};return{type:'external',embed:url};
}

                    const published=a.published?new Date(a.published):null;
                    const time=published&&!Number.isNaN(published.getTime())?published.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
                    return `<article class="flash-news-card" ${link?`role="link" tabindex="0" onclick="window.open('${escapeProfile(link)}','_blank','noopener')"`:''}>
                      ${image?`<img class="flash-news-image" src="${escapeProfile(image)}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}
                      <div class="flash-news-copy"><h3>${title}</h3><div class="flash-news-meta">${time?`<time>${time}</time><span>•</span>`:''}<span>ESPN Football</span></div></div>
                    </article>`;
                }).join(''):`<div class="flash-news-empty">ယခုအချိန်တွင် API မှ သတင်းမရရှိသေးပါ။ ခဏနေပြီး ပြန်စမ်းပါ။</div>`;
            }catch(e){feed.innerHTML=`<div class="flash-news-empty">သတင်း API ကို ချိတ်ဆက်မရပါ။ အင်တာနက် သို့မဟုတ် API ဝန်ဆောင်မှုကို စစ်ဆေးပြီး ပြန်ဖွင့်ပါ။</div>`;}
        }else if(nav==='leagues'){
            feed.innerHTML=MAJOR_LEAGUES.map(lg=>`<div class="box-3d" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="selectedLeagueCode='${lg.code}';switchBottomNav('matches', document.querySelector('.nav-item'))"><div style="display:flex;align-items:center;gap:10px;"><img class="flag-icon" src="${lg.flag}"><span style="font-weight:800;font-size:12px;">${getLeagueName(lg)}</span></div><span style="color:var(--accent);font-size:11px;font-weight:800;">${tr('view_matches')}</span></div>`).join('');
        }else if(nav==='profile')renderProfileScreen();
    }
}

let showFinishedMatches=localStorage.getItem('flash_show_finished')!=='0';
function toggleQuickMenu(){const m=document.getElementById('quickMenu'),b=document.getElementById('quickMenuBackdrop');m.classList.toggle('show');b.classList.toggle('show');m.setAttribute('aria-hidden',String(!m.classList.contains('show')));document.getElementById('finishedSwitch').classList.toggle('on',showFinishedMatches);document.getElementById('liveSwitch').classList.toggle('on',liveOnly);}
function closeQuickMenu(){document.getElementById('quickMenu')?.classList.remove('show');document.getElementById('quickMenuBackdrop')?.classList.remove('show');}
function setLeagueDisplay(mode){document.querySelectorAll('#mainFeed .league-card').forEach(c=>c.classList.toggle('collapsed',mode==='none'));document.querySelectorAll('#mainFeed .league-head .collapse-mark').forEach(x=>x.textContent=mode==='none'?'＋':'－');closeQuickMenu();}
function toggleFinishedMatches(){showFinishedMatches=!showFinishedMatches;localStorage.setItem('flash_show_finished',showFinishedMatches?'1':'0');renderMatchesList();document.getElementById('finishedSwitch').classList.toggle('on',showFinishedMatches);}
function getProfile(){try{return JSON.parse(localStorage.getItem('flash_profile')||'null')}catch(e){return null}}

function renderProfileScreen(){
    const feed=document.getElementById('mainFeed'),u=getProfile(),name=u?.name||'Guest User',email=u?.email||tr('guest_mode');
    const avatar=u?.avatar?`<img src="${u.avatar}" alt="Profile">`:name.trim().charAt(0).toUpperCase();
    const languages=[['my','မြန်မာ'],['en','English'],['th','ไทย'],['zh','中文'],['id','Bahasa Indonesia'],['vi','Tiếng Việt'],['ja','日本語'],['ko','한국어'],['hi','हिन्दी'],['es','Español'],['fr','Français'],['ar','العربية']];
    const clubs=[...new Set(rawMatchesCache.flatMap(m=>[m.homeName,m.awayName]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    feed.innerHTML=`<div class="profile-shell">
    <section class="profile-card"><div class="profile-head"><div class="profile-avatar">${avatar}</div><div class="profile-user"><div class="profile-name">${escapeProfile(name)}</div><div class="profile-muted">${escapeProfile(email)}</div><div class="profile-muted profile-state">● ${u?tr('signed_in'):tr('guest_mode')}</div></div></div>
    <div class="profile-actions"><button type="button" class="profile-action" onclick="openAccountModal()">${u?tr('btn_edit_acc'):tr('btn_login_reg')}</button><button type="button" class="profile-action" onclick="document.getElementById('avatarPicker').click()">${tr('btn_avatar')}</button><input id="avatarPicker" type="file" accept="image/*" hidden onchange="saveAvatar(this)"><button type="button" class="profile-action" onclick="openSupportModal(true)">${tr('btn_support')}</button></div></section>
    <section class="profile-card"><div class="profile-section-title">${tr('sec_settings')}</div>
    <div class="profile-row"><span>${tr('lbl_lang')}</span><select id="profileLanguage" onchange="setAppLanguage(this.value)">${languages.map(([v,n])=>`<option value="${v}" ${((localStorage.getItem('flash_lang')||lang)===v)?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="profile-row"><span>${tr('lbl_theme')}</span><select id="profileTheme" onchange="setThemeFromProfile(this.value)"><option value="dark" ${themeMode==='dark'?'selected':''}>${tr('theme_dark')}</option><option value="light" ${themeMode==='light'?'selected':''}>${tr('theme_light')}</option></select></div>
    <div class="profile-row"><span>${tr('lbl_match_notif')}</span><label class="toggle-switch"><input id="matchNotifToggle" type="checkbox" ${localStorage.getItem('flash_notif_match')!=='0'?'checked':''} onchange="toggleNotifications('match',this.checked)"><span></span></label></div>
    <div class="profile-row"><span>${tr('lbl_fav_notif')}</span><label class="toggle-switch"><input id="favNotifToggle" type="checkbox" ${localStorage.getItem('flash_notif_fav')!=='0'?'checked':''} onchange="toggleNotifications('fav',this.checked)"><span></span></label></div>
    <div class="profile-row"><span>${tr('lbl_phone_notif')}</span><button type="button" class="profile-secondary" onclick="requestNotificationPermission()">${tr('btn_enable')}</button></div></section>
    <section class="profile-card"><div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid rgba(148,163,184,.14);margin-bottom:4px;"><span class="profile-section-title" style="padding:0;border:0;margin:0;">${tr('fav_title')}</span>${favClubs.length?`<button type="button" class="profile-secondary" style="padding:5px 10px;font-size:10.5px;" onclick="clearAllFavTeams()">${tr('btn_clear_all')}</button>`:''}</div><div class="favorite-picker"><input type="search" id="favInput" list="clubSuggestions" placeholder="${tr('fav_search_ph')}" class="profile-field" style="margin:0;min-width:0;flex:1"><datalist id="clubSuggestions">${clubs.map(n=>`<option value="${escapeProfile(n)}">`).join('')}</datalist><button type="button" class="profile-primary" onclick="addFavFromInput()">${tr('btn_add')}</button></div><div class="favorite-list">${favClubs.map((c,idx)=>{const found=rawMatchesCache.find(m=>m.homeName===c||m.awayName===c);const logo=found?(found.homeName===c?found.homeLogo:found.awayLogo):'';return `<div class="profile-row favorite-team">${logo?`<img src="${logo}" alt="" onerror="this.style.display='none'">`:''}<span>${escapeProfile(c)}</span><button type="button" class="profile-secondary" onclick="removeFavByIndex(${idx})">${tr('btn_remove')}</button></div>`}).join('')||`<div class="profile-muted">${tr('no_fav')}</div>`}</div></section>
    <section class="profile-card"><div class="profile-section-title">${tr('sec_account')}</div><div class="profile-row"><span>${tr('lbl_acc_status')}</span><b style="color:var(--accent)">${u?tr('signed_in'):tr('guest_mode')}</b></div>${u?`<button type="button" class="profile-secondary" style="width:100%;margin-top:10px" onclick="logoutProfile()">${tr('btn_logout')}</button>`:`<button type="button" class="profile-primary" style="width:100%;margin-top:10px" onclick="openAccountModal()">${tr('btn_login')}</button>`}</section>
    <div class="profile-version">Version 1.0</div></div>`;
}

function escapeProfile(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openProfileModal(title,html){document.getElementById('profileModalTitle').textContent=title;document.getElementById('profileModalBody').innerHTML=html;document.getElementById('profileModal').classList.add('show');}
function closeProfileModal(){document.getElementById('profileModal').classList.remove('show');}
function openAccountModal(){const u=getProfile();openProfileModal(u?tr('btn_edit_acc'):tr('btn_login_reg'),`<input id="accountName" class="profile-field" placeholder="Name / Nickname" value="${escapeProfile(u?.name||'')}"><input id="accountEmail" class="profile-field" type="email" placeholder="Email" value="${escapeProfile(u?.email||'')}"><input id="accountPassword" class="profile-field" type="password" placeholder="Password"><div class="profile-modal-actions"><button type="button" class="profile-primary" onclick="saveLocalAccount()">${tr('btn_save')}</button><button type="button" class="profile-secondary" onclick="closeProfileModal()">${tr('btn_close')}</button></div>`);}
function saveLocalAccount(){const name=document.getElementById('accountName').value.trim(),email=document.getElementById('accountEmail').value.trim(),pw=document.getElementById('accountPassword').value;if(!name||!/^\S+@\S+\.\S+$/.test(email)||pw.length<4){showFlashToast('Please enter Name, Email & Password');return;}const u=getProfile()||{};u.name=name;u.email=email;localStorage.setItem('flash_profile',JSON.stringify(u));closeProfileModal();renderProfileScreen();showFlashToast('✓');}
function logoutProfile(){localStorage.removeItem('flash_profile');renderProfileScreen();showFlashToast('✓');}
function saveAvatar(input){const f=input.files?.[0];if(!f)return;if(f.size>2*1024*1024){showFlashToast('Max 2MB');return;}const r=new FileReader();r.onload=()=>{const u=getProfile()||{name:'Guest User',email:'Guest Mode'};u.avatar=r.result;localStorage.setItem('flash_profile',JSON.stringify(u));renderProfileScreen();showFlashToast('✓');};r.readAsDataURL(f);}
async function requestNotificationPermission(){if(!('Notification' in window)){showFlashToast('Notifications not supported');return;}const p=await Notification.requestPermission();showFlashToast(p==='granted'?'✓ Notification Enabled':'Notification Denied');}
function toggleNotifications(kind,on){localStorage.setItem(kind==='match'?'flash_notif_match':'flash_notif_fav',on?'1':'0');if(on)requestNotificationPermission();}
function openNotifications(){switchBottomNav('profile',document.querySelectorAll('.nav-item')[4]);setTimeout(()=>document.getElementById('matchNotifToggle')?.scrollIntoView({behavior:'smooth',block:'center'}),80);}
function openSupportModal(){openProfileModal(tr('btn_support'),`<p class="support-note">${tr('support_desc')}</p><textarea id="supportMessage" class="profile-field" rows="4" placeholder="${tr('support_ph')}"></textarea><input id="supportImage" class="profile-field" type="file" accept="image/*"><div class="profile-modal-actions"><button type="button" class="profile-primary" onclick="saveSupportMessage()">${tr('btn_send_admin')}</button><button type="button" class="profile-secondary" onclick="closeProfileModal()">${tr('btn_close')}</button></div>`);}
function saveSupportMessage(){const message=document.getElementById('supportMessage').value.trim(),file=document.getElementById('supportImage').files?.[0];if(!message&&!file){return;}const item={message,hasImage:!!file,createdAt:new Date().toISOString(),status:'PENDING'};const q=JSON.parse(localStorage.getItem('flash_support_outbox')||'[]');q.push(item);localStorage.setItem('flash_support_outbox',JSON.stringify(q));closeProfileModal();showFlashToast('✓');}

function setAppLanguage(v){
    lang = TEXT[v] ? v : 'en';
    localStorage.setItem('flash_lang', lang);
    document.documentElement.lang = lang;
    applyAllTranslations();
    initDateScroller();
    // Re-render the currently visible screen so generated text uses the selected language.
    if(activeNav==='profile') renderProfileScreen();
    else if(activeNav==='matches') renderMatchesList();
    else if(activeNav==='leagues') switchBottomNav('leagues', document.querySelector('.bottom-nav .nav-item:nth-child(3)'));
    else if(activeNav==='livetv') renderLiveTvScreen();
    else if(activeNav==='news') switchBottomNav('news', document.querySelector('.bottom-nav .nav-item:nth-child(2)'));
    showFlashToast(`${lang.toUpperCase()} · ${tr('lbl_lang')}`);
}

function setThemeFromProfile(mode){
    applyThemeMode(mode);
    if(activeNav==='profile')renderProfileScreen();
    showFlashToast(themeMode==='light' ? tr('theme_light') : tr('theme_dark'));
}

function addFavFromInput(){const v=document.getElementById('favInput')?.value.trim();if(!v)return;if(!favClubs.includes(v)){favClubs.push(v);localStorage.setItem('flash_fav_clubs',JSON.stringify(favClubs));}renderProfileScreen();showFlashToast(`★ ${v}`);}
function removeFavByIndex(idx){
    if(idx<0||idx>=favClubs.length)return;
    const removed=favClubs.splice(idx,1)[0];
    localStorage.setItem('flash_fav_clubs',JSON.stringify(favClubs));
    if(activeNav==='profile')renderProfileScreen();
    else if(activeNav==='matches')renderMatchesList();
    showFlashToast(`✕ ${removed}`);
}
function removeFavByName(name){
    favClubs=favClubs.filter(c=>c!==name);
    localStorage.setItem('flash_fav_clubs',JSON.stringify(favClubs));
    if(activeNav==='profile')renderProfileScreen();
    else if(activeNav==='matches')renderMatchesList();
    showFlashToast(`✕ ${name}`);
}
function clearAllFavTeams(){
    favClubs=[];
    localStorage.setItem('flash_fav_clubs',JSON.stringify(favClubs));
    if(activeNav==='profile')renderProfileScreen();
    else if(activeNav==='matches')renderMatchesList();
    showFlashToast('✓');
}
function toggleFavTeam(name){if(favClubs.includes(name))favClubs=favClubs.filter(c=>c!==name);else favClubs.push(name);localStorage.setItem('flash_fav_clubs',JSON.stringify(favClubs));if(activeNav==='profile')renderProfileScreen();else if(currentMatchObj)loadMatchDetailTab('facts',document.querySelector('#dtlTabs .d-subtab'));else if(activeNav==='matches')renderMatchesList();}
function toggleLiveMode(){
    liveOnly=!liveOnly;
    document.getElementById('btnLiveOnly').classList.toggle('active-green',liveOnly);
    if(activeNav!=='matches'){
        switchBottomNav('matches', document.querySelector('.bottom-nav .nav-item'));
    }else{
        renderMatchesList();
    }
}
function switchLang(){document.getElementById('profileLanguage')?.focus();}

applyThemeMode(themeMode);
applyAllTranslations();
checkBackendHealth();
initDateScroller();
fetchRealMatches();
</script>

<style>
/* Shared Admin/User communication refinement */
.support-preview{display:block;max-width:100%;max-height:180px;border-radius:10px;margin:8px 0;border:1px solid #304057}
.stream-empty{padding:28px 14px;text-align:center;color:#94a3b8;border:1px dashed #304057;border-radius:14px;background:#0d141e}
.stream-player{width:100%;aspect-ratio:16/9;background:#000;border:0;display:block}
</style>
<script>
// FLASH LIVE shared-server integration (v4)
const FLASH_API = API_BASE_URL;
let flashServerStreams=[];
async function flashLoadStreams(){
  try{
    const r=await fetch(`${FLASH_API}/api/flash-live`,{cache:'no-store'});
    const d=await r.json();
    if(!r.ok)throw new Error(d.message||'Server error');

    const nextStreams=Array.isArray(d.streams)?d.streams:[];
    // Do not rebuild the LIVE TV DOM on every poll.
    // Rebuilding it destroys the active YouTube iframe / video player.
    const signature=list=>JSON.stringify(list.map(s=>({
      id:s.id,title:s.title,url:s.url,type:s.type,active:s.active
    })));
    const changed=signature(nextStreams)!==signature(flashServerStreams);

    flashServerStreams=nextStreams;

    if(changed && activeNav==='livetv' && activeTvScreen==='flash_live'){
      const selectedStillExists=flashServerStreams.some(
        s=>s.active!==false && String(s.id)===String(selectedFlashStreamId)
      );
      if(!selectedStillExists){
        selectedFlashStreamId=null;
        renderLiveTvScreen();
      } else {
        // Keep the current player mounted while its stream remains unchanged.
        // Refresh cards only when the current selected stream is not playing.
        const player=document.querySelector('#mainFeed iframe.stream-player, #mainFeed video.stream-player');
        if(!player)renderLiveTvScreen();
      }
    }
  }catch(e){
    console.warn('FLASH LIVE feed:',e.message);
  }
}
// Shared FLASH LIVE player: tapping any stream card promotes it to the large player.
let selectedFlashStreamId = null;
function renderLiveTvScreen(){
 lang = TEXT[localStorage.getItem('flash_lang')] ? localStorage.getItem('flash_lang') : (TEXT[lang] ? lang : 'my');
 const feed=document.getElementById('mainFeed');
 if(activeTvScreen==='football_live'){
   feed.innerHTML=`<div class="tv-switch-bar"><div class="tv-tab-btn" onclick="switchTvSubScreen('flash_live')">${tvtr('flash')}</div><div class="tv-tab-btn active" onclick="switchTvSubScreen('football_live')">${tvtr('football')}</div></div><div class="stream-empty">${tvtr('matches')}</div>`;
   return;
 }
 const streams=flashServerStreams.filter(s=>s.active!==false);
 if(!streams.some(s=>String(s.id)===String(selectedFlashStreamId))) selectedFlashStreamId=streams.length?String(streams[0].id):null;
 const selected=streams.find(s=>String(s.id)===String(selectedFlashStreamId));
 const makePreview=(s)=>{
   const info=parseStreamUrl(String(s.url||''));
   if(info.type==='youtube') return `<img src="${info.thumb}" alt="" style="width:100%;height:100%;object-fit:cover">`;
   if(info.type==='direct') return `<video src="${escapeProfile(s.url)}#t=1" preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
   return `<div style="display:grid;place-items:center;height:100%;color:#9ca3af;font-weight:800">LIVE STREAM</div>`;
 };
 const card=(s,featured=false)=>{
   const id=String(s.id).replace(/[^a-zA-Z0-9_-]/g,'');
   const title=escapeProfile(s.title||'FLASH LIVE');
   if(featured){
     return `<article class="video-card-3d stream-featured"><div class="video-thumb-wrap" id="tv_box_${id}" onclick="startSharedStream('${id}')">${makePreview(s)}<span class="live-tag-overlay">● ${tvtr('live')}</span><div class="play-btn-overlay"><div class="play-circle"><svg style="width:22px;height:22px;fill:#05080c;margin-left:2px" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div><div class="stream-info" style="padding:12px"><strong>${title}</strong><span>${tvtr('broadcast')}</span></div></article>`;
   }
   return `<article class="video-card-3d stream-compact" role="button" tabindex="0" onclick="selectFeaturedStream('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectFeaturedStream('${id}')}"><div class="video-thumb-wrap">${makePreview(s)}<span class="live-tag-overlay">● ${tvtr('live')}</span><div class="play-btn-overlay"><div class="play-circle"><svg style="width:18px;height:18px;fill:#05080c;margin-left:2px" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div><div class="stream-info" style="padding:8px"><strong>${title}</strong><span>${tvtr('broadcast')}</span></div></article>`;
 };
 const featured=selected?card(selected,true):`<div class="stream-empty">${tvtr('empty')}</div>`;
 const others=streams.filter(s=>!selected||String(s.id)!==String(selected.id));
 const otherHtml=others.length?`<div class="stream-more-title">${tvtr('other')} <span>${others.length}</span></div><div class="stream-compact-list">${others.map(s=>card(s,false)).join('')}</div>`:'';
 feed.innerHTML=`<div class="tv-switch-bar"><div class="tv-tab-btn active" onclick="switchTvSubScreen('flash_live')">${tvtr('flash')}</div><div class="tv-tab-btn" onclick="switchTvSubScreen('football_live')">${tvtr('football')}</div></div><div class="stream-featured-wrap">${featured}</div>${otherHtml}`;
}
function selectFeaturedStream(id){
 selectedFlashStreamId=String(id);
 renderLiveTvScreen();
 document.getElementById('mainFeed')?.scrollIntoView({behavior:'smooth',block:'start'});
}
function switchTvSubScreen(scr){activeTvScreen=scr;renderLiveTvScreen();}
function startSharedStream(id){
 const s=flashServerStreams.find(x=>String(x.id)===String(id));if(!s)return;
 const box=document.getElementById(`tv_box_${String(id).replace(/[^a-zA-Z0-9_-]/g,'')}`);if(!box)return;
 const info=parseStreamUrl(s.url||'');
 if(info.type==='youtube')box.innerHTML=`<div style="width:100%;height:100%;min-height:240px;display:flex;flex-direction:column;background:#000"><iframe class="stream-player" src="${info.embed}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
 else if(info.type==='direct'){box.innerHTML=`<video id="flash_live_video" class="stream-player" controls autoplay playsinline></video>`;const video=box.querySelector('video');if(/\.m3u8(\?|$)/i.test(s.url||'')){if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=s.url;else if(window.Hls&&Hls.isSupported()){const hls=new Hls();hls.loadSource(s.url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)console.warn('HLS playback error',data.type);});}else{box.innerHTML='<div class="stream-empty">ဒီ Browser မှာ HLS မထောက်ပံ့ပါ</div>';}}else video.src=s.url;}
 else window.open(s.url,'_blank','noopener');
}
// Send text + optional image to the shared backend.
async function saveSupportMessage(){
 const message=document.getElementById('supportMessage')?.value.trim()||'';
 const file=document.getElementById('supportImage')?.files?.[0];
 if(!message&&!file){showFlashToast('စာ သို့မဟုတ် ပုံ ထည့်ပါ');return;}
 if(file&&file.size>3*1024*1024){showFlashToast('ပုံအရွယ်အစား 3MB အောက်သာ');return;}
 const u=typeof getProfile==='function'?getProfile():null;
 let image=null;
 if(file) image=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file);});
 try{
  const r=await fetch(`${FLASH_API}/api/support/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:u?.name||'Guest User',email:u?.email||'',message,image})});
  const d=await r.json();if(!r.ok)throw new Error(d.message||'ပို့မရပါ');
  closeProfileModal();showFlashToast('Admin ထံ ပေးပို့ပြီးပါပြီ');
 }catch(e){showFlashToast('ပို့မရပါ။ Server ချိတ်ဆက်မှု စစ်ပါ');}
}
// Poll shared feed so Admin publications appear without app restart.
flashLoadStreams();setInterval(flashLoadStreams,15000);
</script>
