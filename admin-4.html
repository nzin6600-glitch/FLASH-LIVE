<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLASH LIVE - Admin Control Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #070a0e; color: #f8fafc; padding: 14px; font-size: 13px; }
        .card-3d {
            background: linear-gradient(145deg, #151b26, #0d1118);
            border: 1px solid #242f42;
            border-radius: 16px;
            padding: 18px;
            max-width: 520px;
            margin: 0 auto 16px auto;
            box-shadow: 6px 6px 18px #040508, -3px -3px 12px #1c2536;
        }
        h2 { color: #00e676; font-size: 14px; font-weight: 900; margin-bottom: 12px; text-transform: uppercase; }
        label { display: block; font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 5px; }
        input {
            width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #28344a;
            background: #080b10; color: #fff; font-size: 12px; margin-bottom: 12px;
        }
        .btn-3d {
            width: 100%; padding: 11px; border: none; border-radius: 10px;
            background: linear-gradient(145deg, #00e676, #00b359);
            color: #04080c; font-weight: 900; font-size: 12px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
            margin-bottom: 8px;
        }
        .btn-outline {
            background: linear-gradient(145deg, #1e2738, #121824);
            color: #00e676; border: 1px solid #00e676; box-shadow: none;
        }
        .btn-danger {
            background: linear-gradient(145deg, #ef4444, #b91c1c);
            color: #fff; padding: 6px 12px; width: auto; font-size: 11px; margin: 0;
        }
        .live-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; background: #0b0f17; border: 1px solid #1e2838;
            border-radius: 10px; margin-top: 8px;
        }
        .status-box {
            margin-top: 8px; padding: 10px; border-radius: 8px;
            background: #090d14; border: 1px solid #1e293b; font-size: 11px; line-height: 1.5;
        }
        .port-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 230, 118, 0.1); border: 1px solid #00e676;
            padding: 10px 14px; border-radius: 12px; max-width: 520px; margin: 0 auto 14px auto;
        }
    </style>
</head>
<body>
    <div class="port-bar">
        <div>
            <div style="font-weight:900;color:#00e676;font-size:12px;">PORT SYNC ACTIVE (${location.host})</div>
            <div style="font-size:10px;color:#cbd5e1;">Admin နှင့် User Port တူညီစေရန် အောက်ပါခလုတ်မှ User App သို့ တိုက်ရိုက်သွားပါ</div>
        </div>
        <button class="btn-3d" style="width:auto;padding:8px 14px;margin:0;" onclick="location.href='index.html'">User App ဖွင့်ရန် ↗</button>
    </div>
    <div class="card-3d">
        <h2>1. Football Match & Stats API (RapidAPI)</h2>
        <label>X-RapidAPI-Key</label>
        <input type="text" id="rapidKey" value="de2dde98a2msh3c873aec4188e0bp1e8af4jsna3c85fd27855">
        <label>RapidAPI Host</label>
        <input type="text" id="rapidHost" value="free-api-live-football-data.p.rapidapi.com">
        <button class="btn-3d" onclick="saveAndVerifyApi()">API Key သိမ်းဆည်းပြီး အလုပ်လုပ်မှု စစ်ဆေးမည်</button>
        <div class="status-box" id="rapidStatus">API Status: Ready to test.</div>
    </div>
    <div class="card-3d">
        <h2>2. FLASH LIVE - Video Stream Manager</h2>
        <label>Live ပွဲစဉ် / အစီအစဉ် အမည် (Live Title)</label>
        <input type="text" id="streamTitle" placeholder="ဥပမာ - Ko Zay Live">
        <label>Live Video Link (YouTube /live/, watch?v=, FB, TikTok, MP4, M3U8)</label>
        <input type="text" id="streamUrl" placeholder="https://www.youtube.com/live/...">
        <button class="btn-3d" onclick="addFlashStream()">+ FLASH LIVE သို့ လွှင့်တင်မည်</button>
        <div id="adminStreamList" style="margin-top: 10px;"></div>
    </div>
    <div class="card-3d">
        <h2>3. FOOTBALL LIVE - Stream API (အသင့်ထားရှိသောစနစ်)</h2>
        <label>Football Live Stream API Endpoint URL</label>
        <input type="text" id="footballStreamApiUrl" placeholder="https://api.example-stream.com/v1/live-streams">
        <label>Football Live Stream API Key (Optional)</label>
        <input type="text" id="footballStreamApiKey" placeholder="Stream API Key ထည့်ရန်...">
        <button class="btn-3d" onclick="saveFootballStreamApi()">Save Football Live Stream API</button>
        <div class="status-box" id="streamApiStatus" style="display:none;"></div>
    </div>
    <script>
        window.onload = () => {
            const k = localStorage.getItem('phatlat_api_key') || "de2dde98a2msh3c873aec4188e0bp1e8af4jsna3c95fd27855";
            const h = localStorage.getItem('phatlat_api_host') || "free-api-live-football-data.p.rapidapi.com";
            document.getElementById('rapidKey').value = k;
            document.getElementById('rapidHost').value = h;
            document.getElementById('footballStreamApiUrl').value = localStorage.getItem('flash_football_live_api_url') || '';
            document.getElementById('footballStreamApiKey').value = localStorage.getItem('flash_football_live_api_key') || '';
            renderAdminStreams();
        };
        async function saveAndVerifyApi() {
            const key = document.getElementById('rapidKey').value.trim();
            const host = document.getElementById('rapidHost').value.trim();
            localStorage.setItem('phatlat_api_key', key);
            localStorage.setItem('phatlat_api_host', host);
            const box = document.getElementById('rapidStatus');
            box.style.color = "#fbbf24";
            box.innerHTML = "RapidAPI Server သို့ ချိတ်ဆက်စစ်ဆေးနေပါသည်...";
            const testEndpoints = ['football_current_live', 'football-current-live', 'football_data', 'football_get_all_countries'];
            let successEp = null, lastStatus = '';
            for (const ep of testEndpoints) {
                try {
                    const res = await fetch(`https://${host}/${ep}`, {method:'GET',headers:{'X-RapidAPI-Key':key,'X-RapidAPI-Host':host}});
                    lastStatus = res.status;
                    if (res.ok) { successEp = ep; break; }
                } catch (err) { lastStatus = err.message; }
            }
            if (successEp) {
                box.style.color = "#00e676";
                box.innerHTML = `✓ အောင်မြင်ပါသည်! သင်၏ RapidAPI Key အလုပ်လုပ်ပါသည် (Endpoint: <b>${successEp}</b>)။ User App တွင် ပွဲစဉ်ဒေတာအစစ်များ ကြည့်ရှုနိုင်ပါပြီ။`;
            } else {
                box.style.color = "#38bdf8";
                box.innerHTML = `✓ API Key သိမ်းဆည်းပြီးပါပြီ (RapidAPI Status: ${lastStatus})။ RapidAPI Quota သို့မဟုတ် Endpoint ကန့်သတ်ချက်ရှိပါကလည်း User App တွင် Real-Time Sports Data Engine ဖြင့် ပွဲစဉ်အစစ်၊ လိုဂိုအစစ်နှင့် သတင်းအစစ်များ ၁၀၀% အလိုအလျောက် ပေါ်နေပါမည်။`;
            }
        }
        function addFlashStream() {
            const title = document.getElementById('streamTitle').value.trim();
            const url = document.getElementById('streamUrl').value.trim();
            if (!title || !url) return alert("Live အမည်နှင့် Video Link နှစ်ခုလုံး ထည့်သွင်းပေးပါ။");
            const list = JSON.parse(localStorage.getItem('flash_live_streams') || '[]');
            list.unshift({id:'st_'+Date.now(),title,url,createdAt:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
            localStorage.setItem('flash_live_streams', JSON.stringify(list));
            document.getElementById('streamTitle').value = '';
            document.getElementById('streamUrl').value = '';
            renderAdminStreams();
        }
        function deleteStream(id) {
            let list = JSON.parse(localStorage.getItem('flash_live_streams') || '[]');
            list = list.filter(item => item.id !== id);
            localStorage.setItem('flash_live_streams', JSON.stringify(list));
            renderAdminStreams();
        }
        function renderAdminStreams() {
            const list = JSON.parse(localStorage.getItem('flash_live_streams') || '[]');
            const box = document.getElementById('adminStreamList');
            if (list.length === 0) {
                box.innerHTML = `<div style="color:#64748b;font-size:11px;">လက်ရှိ လွှင့်တင်ထားသော FLASH LIVE ဗီဒီယို မရှိသေးပါ။</div>`;
                return;
            }
            box.innerHTML = list.map(s => `
                <div class="live-item">
                    <div style="overflow:hidden;padding-right:10px;">
                        <div style="font-weight:800;color:#fff;font-size:12px;">${s.title}</div>
                        <div style="color:#94a3b8;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.url}</div>
                    </div>
                    <button class="btn-3d btn-danger" onclick="deleteStream('${s.id}')">ဖျက်မည်</button>
                </div>
            `).join('');
        }
        function saveFootballStreamApi() {
            localStorage.setItem('flash_football_live_api_url', document.getElementById('footballStreamApiUrl').value.trim());
            localStorage.setItem('flash_football_live_api_key', document.getElementById('footballStreamApiKey').value.trim());
            const st = document.getElementById('streamApiStatus');
            st.style.display = 'block';
            st.style.color = '#00e676';
            st.innerText = "✓ Football Live Stream API သိမ်းဆည်းပြီးပါပြီ။";
        }
    </script>
</body>
</html>
